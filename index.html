            octx.moveTo(mx, my + cl); octx.lineTo(mx, my); octx.lineTo(mx + cl, my);
            octx.moveTo(mx + mw - cl, my); octx.lineTo(mx + mw, my); octx.lineTo(mx + mw, my + cl);
            octx.moveTo(mx, my + mh - cl); octx.lineTo(mx, my + mh); octx.lineTo(mx + cl, my + mh);
            octx.moveTo(mx + mw - cl, my + mh); octx.lineTo(mx + mw, my + mh); octx.lineTo(mx + mw, my + mh - cl);
            octx.stroke();

            // Tag pill above primary nearest face
            const tagText = allFaces.length > 1 ? 'NEAREST TARGET · CAPTURING' : 'PRIMARY TARGET';
            octx.font = '700 11px "JetBrains Mono", monospace';
            const tw = octx.measureText(tagText).width + 14;
            const ty = Math.max(4, my - 22);
            octx.fillStyle = color;
            octx.fillRect(mx, ty, tw, 18);
            octx.fillStyle = '#020617';
            octx.fillText(tagText, mx + 7, ty + 13);
          } else {
            // Secondary / Farther student in frame — ignored by Nearest-Student Lock
            octx.save();
            octx.setLineDash([6, 4]);
            octx.strokeStyle = 'rgba(148, 163, 184, 0.75)';
            octx.lineWidth = 2;
            octx.strokeRect(mx, my, mw, mh);
            octx.restore();

            const skipText = `FARTHER (#${face.proximityRank}) · IGNORED`;
            octx.font = '600 10px "JetBrains Mono", monospace';
            const sw = octx.measureText(skipText).width + 12;
            const sy = Math.max(4, my - 20);
            octx.fillStyle = 'rgba(15, 23, 42, 0.82)';
            octx.fillRect(mx, sy, sw, 16);
            octx.fillStyle = '#cbd5e1';
            octx.fillText(skipText, mx + 6, sy + 11);
          }
        });
      }, []);

      const processLoop = useCallback(() => {
        if (!cameraOn || !videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        if (video.readyState >= 2 && video.videoWidth > 0) {
          if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
          }
          ctx.filter = `brightness(${brightnessBoost}%) contrast(106%)`;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          ctx.filter = 'none';
          window.FG.autoEnhanceFrame(canvas);

          const poll = window.FG.pollLiveFrame(canvas);
          setFaceDetected(poll.detected);
          const totalFaces = poll.totalFaces || (poll.detected ? 1 : 0);
          setMultiFaceInfo({
            total: totalFaces,
            ignoredCount: Math.max(0, totalFaces - 1)
          });

          if (poll.detected) {
            const liveCheck = window.FG.analyzeLiveness(
              canvas,
              poll,
              poll.kps,
              aiSettings.strictMode,
              aiSettings.activeAgentEnabled !== false
            );
            setLivenessState(liveCheck);

            const spoofBlocked = aiSettings.antiSpoofEnabled && liveCheck.isSuspicious;
            const challengePending =
              aiSettings.antiSpoofEnabled &&
              aiSettings.activeAgentEnabled !== false &&
              liveCheck.agentDecision === 'CHALLENGE_ACTIVE';

            drawFaceBoxes(poll.allFaces, canvas.width, canvas.height, spoofBlocked, challengePending);

            const match = matchDescriptor(poll.desc);
            setMatchState(match);

            const candidatePerson = match.person || match.candidate;
            const identifiedSpoofPerson = candidatePerson && match.confidence >= 42 ? candidatePerson : null;

            if (spoofBlocked) {
              streakRef.current = { personId: null, count: 0 };
              setLastVerifiedCard(null);
              const nowTs = Date.now();
              if (nowTs - lastSpoofRecordRef.current > 2000) {
                lastSpoofRecordRef.current = nowTs;
                playChime('spoof');
                const spoofSnap = captureStudentSnapshot(canvas, true);
                const targetLabel = identifiedSpoofPerson
                  ? `${identifiedSpoofPerson.name} (${identifiedSpoofPerson.id})`
                  : 'Unknown Subject';

                onSpoofDetected(
                  {
                    id: 'SPF-' + nowTs,
                    timestamp: new Date().toISOString(),
                    suspiciousScore: liveCheck.suspiciousScore,
                    flags: liveCheck.flags,
                    targetStudentId: identifiedSpoofPerson ? identifiedSpoofPerson.id : null,
                    suspectedTarget: targetLabel,
                    sourceType: 'Live Camera Spoof (Mobile Photo/Video)',
                    snapshotUrl: spoofSnap
                  },
                  identifiedSpoofPerson
                );
                setSpoofWarningBanner({
                  title: 'Spoof Activity Detected — Attendance Blocked & Logged in AI Spoof Alerts',
                  detail: `Blocked ${targetLabel} (${liveCheck.suspiciousScore}% Spoof Risk)${
                    identifiedSpoofPerson ? ' for the current period' : ''
                  }. Evidence photo captured and logged.`,
                  snapshotUrl: spoofSnap
                });
              }
            } else if (challengePending) {
              // Active AI Agent is waiting for slight 3D head turn/nod before deciding
              streakRef.current = { personId: null, count: 0 };
            } else if (match.isMatch && match.person && poll.fresh) {
              const immediateElig = checkPeriodEligibility(match.person);
              if (!immediateElig.ok) {
                streakRef.current = { personId: null, count: 0 };
                const nowBlockedTs = Date.now();
                if (nowBlockedTs - periodNoticeRef.current > 5000) {
                  periodNoticeRef.current = nowBlockedTs;
                  onNotice(immediateElig.reason, 'danger');
                }
              } else {
                if (streakRef.current.personId === match.person.id) {
                  streakRef.current.count += 1;
                } else {
                  streakRef.current = { personId: match.person.id, count: 1 };
                }

                if (streakRef.current.count >= 2) {
                  const now = Date.now();
                  const lastLogTs = cooldownRef.current[match.person.id] || 0;
                  if (now - lastLogTs > 25000) {
                    const elig = checkPeriodEligibility(match.person);
                    if (!elig.ok) {
                      streakRef.current = { personId: null, count: 0 };
                      if (now - periodNoticeRef.current > 6000) {
                        periodNoticeRef.current = now;
                        onNotice(elig.reason, 'danger');
                      }
                    } else {
                      cooldownRef.current[match.person.id] = now;
                      streakRef.current = { personId: null, count: 0 };
                      playChime('success');

                      const snappedPhoto = captureStudentSnapshot(canvas);
                      const record = {
                        id: 'ATT-' + Math.floor(10000 + Math.random() * 90000),
                        personId: match.person.id,
                        personName: match.person.name,
                        department: match.person.department,
                        timestamp: new Date().toISOString(),
                        confidence: match.confidence,
                        livenessScore: liveCheck.authenticityScore,
                        suspiciousScore: liveCheck.suspiciousScore,
                        capturedPhotoUrl: snappedPhoto,
                        referencePhotoUrl: match.person.photoUrl
                      };
                      setLastVerifiedCard(record);
                      onVerifiedAttendance(record);
                    }
                  }
                }
              }
            } else if (!match.isMatch && poll.fresh) {
              streakRef.current = { personId: null, count: 0 };
            }
          } else {
            drawFaceBoxes([], canvas.width, canvas.height, false, false);
            setMatchState(null);
            streakRef.current = { personId: null, count: 0 };
          }
        }
        rafRef.current = requestAnimationFrame(processLoop);
      }, [
        cameraOn,
        brightnessBoost,
        aiSettings,
        matchDescriptor,
        drawFaceBoxes,
        checkPeriodEligibility,
        onNotice,
        onVerifiedAttendance,
        onSpoofDetected
      ]);

      useEffect(() => {
        if (cameraOn) {
          rafRef.current = requestAnimationFrame(processLoop);
        }
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [cameraOn, processLoop]);

      useEffect(() => () => stopCamera(), [stopCamera]);

      const isSpoofFlagged = aiSettings.antiSpoofEnabled && faceDetected && livenessState.isSuspicious;
      const isChallengeActive =
        aiSettings.antiSpoofEnabled &&
        aiSettings.activeAgentEnabled !== false &&
        faceDetected &&
        !isSpoofFlagged &&
        livenessState.agentDecision === 'CHALLENGE_ACTIVE';
      const isVerifiedMatch = !isSpoofFlagged && !isChallengeActive && faceDetected && matchState?.isMatch;

      const todayStr = new Date().toDateString();
      const todayLogs = attendanceLogs.filter((l) => new Date(l.timestamp).toDateString() === todayStr);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          {/* Geofence & Active Attendance Period Status Banner */}
          {(geofence.enabled || periods.length > 0) && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {geofence.enabled && (
                <div
                  className={`p-3.5 rounded-xl border text-xs flex items-center gap-2.5 ${
                    geoAccess.allowed
                      ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-700 dark:text-emerald-300'
                      : 'bg-rose-500/10 border-rose-500/40 text-rose-600 dark:text-rose-300'
                  }`}
                >
                  <IconPin className="w-4 h-4 shrink-0" />
                  <span className="font-semibold">
                    {geoAccess.allowed
                      ? `Inside Geofence (${Math.round(geoAccess.distance ?? 0)} m from center) · Ready`
                      : geoAccess.reason}
                  </span>
                </div>
              )}

              {periods.length > 0 && (
                <div
                  className={`p-3.5 rounded-xl border text-xs flex items-center gap-2.5 ${
                    activePeriod && activePeriod !== 'none'
                      ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-700 dark:text-cyan-300'
                      : 'bg-amber-500/10 border-amber-500/40 text-amber-700 dark:text-amber-300'
                  }`}
                >
                  <IconClock className="w-4 h-4 shrink-0" />
                  <span className="font-semibold">
                    {activePeriod && activePeriod !== 'none'
                      ? `Active Period: ${activePeriod.name} (${activePeriod.start} – ${activePeriod.end}) · 1 Check-in/Student`
                      : 'No attendance period is currently active.'}
                  </span>
                </div>
              )}
            </div>
          )}

          {/* Top Control Header */}
          <div className="bg-white dark:bg-[#091226] p-5 rounded-2xl border border-slate-200 dark:border-[#1A284C] flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-sm">
            <div>
              <div className="flex flex-wrap items-center gap-2">
                <h1 className="text-xl font-extrabold text-slate-900 dark:text-white">
                  Live Attendance &amp; Active AI Anti-Spoof Agent
                </h1>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border border-emerald-500/30">
                  Active AI Agent v2
                </span>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-600 dark:text-cyan-300 border border-cyan-500/30">
                  {aiSettings.nearestOnlyMode !== false ? 'Nearest-Student Lock ON' : 'Center-Priority Mode'}
                </span>
              </div>
              <p className="text-xs text-slate-500 dark:text-sky-300/70 mt-1">
                Active AI Agent verifies real 3D human presence (preventing false spoofs on real faces) and automatically locks onto the nearest student when multiple faces appear on screen.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2.5 shrink-0">
              {/* Admin-Only Quick Toggles: Nearest-Student Multi-Face Priority & Active AI Liveness Agent */}
              {isAdmin && (
                <>
                  <button
                    type="button"
                    onClick={() =>
                      onUpdateSettings &&
                      onUpdateSettings({
                        ...aiSettings,
                        nearestOnlyMode: aiSettings.nearestOnlyMode === false ? true : false
                      })
                    }
                    className={`px-3.5 py-2.5 rounded-xl border text-xs font-bold transition-all cursor-pointer ${
                      aiSettings.nearestOnlyMode !== false
                        ? 'bg-cyan-500/15 border-cyan-500/40 text-cyan-700 dark:text-cyan-300'
                        : 'bg-slate-100 dark:bg-[#0D1836] border-slate-300 dark:border-[#1E3A8A] text-slate-600 dark:text-sky-200'
                    }`}
                    title="Admin Only: When multiple students stand in front of the camera, capture only the closest student"
                  >
                    {aiSettings.nearestOnlyMode !== false ? '🎯 Nearest Student Only: ON' : '🎯 Nearest Student Only: OFF'}
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      onUpdateSettings &&
                      onUpdateSettings({
                        ...aiSettings,
                        activeAgentEnabled: aiSettings.activeAgentEnabled === false ? true : false
                      })
                    }
                    className={`px-3.5 py-2.5 rounded-xl border text-xs font-bold transition-all cursor-pointer ${
                      aiSettings.activeAgentEnabled !== false
                        ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-700 dark:text-emerald-300'
                        : 'bg-slate-100 dark:bg-[#0D1836] border-slate-300 dark:border-[#1E3A8A] text-slate-600 dark:text-sky-200'
                    }`}
                    title="Admin Only: Active AI Agent eliminates false spoof alerts on real faces using 3D head-parallax verification"
                  >
                    {aiSettings.activeAgentEnabled !== false ? '🤖 Active AI Agent: ON' : '🤖 Active AI Agent: OFF'}
                  </button>
                </>
              )}

              {cameraOn ? (
                <button
                  onClick={stopCamera}
                  className="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow transition-all cursor-pointer"
                >
                  Stop Camera
                </button>
              ) : (
                <button
                  onClick={startCamera}
                  disabled={!geoAccess.allowed}
                  className="brand-gradient text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow hover:opacity-95 disabled:opacity-50 transition-all flex items-center gap-2 cursor-pointer"
                >
                  <IconCamera className="w-4 h-4" />
                  <span>Start Live Scanner</span>
                </button>
              )}
            </div>
          </div>

          {/* Immediate Spoof Blocked Alert Card */}
          {spoofWarningBanner && (
            <div className="bg-rose-500/15 border-2 border-rose-500 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-lg">
              <div className="flex items-center gap-3.5">
                {spoofWarningBanner.snapshotUrl && (
                  <img
                    src={spoofWarningBanner.snapshotUrl}
                    alt="Blocked spoof capture"
                    className="w-24 h-18 rounded-xl object-cover border-2 border-rose-500 shrink-0"
                  />
                )}
                <div>
                  <div className="flex items-center gap-2 text-rose-600 dark:text-rose-300 font-extrabold text-xs uppercase tracking-wider">
                    <IconAlert className="w-4 h-4 shrink-0" />
                    <span>{spoofWarningBanner.title}</span>
                  </div>
                  <p className="text-xs text-slate-700 dark:text-rose-100 mt-1 font-medium">
                    {spoofWarningBanner.detail}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={() => setSpoofWarningBanner(null)}
                className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold self-end sm:self-center shrink-0 cursor-pointer"
              >
                Dismiss
              </button>
            </div>
          )}

          {/* Main Grid: Camera Viewport + Active AI Agent & Verification Cards */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* Left 7 Cols: Live Video + AI Overlay */}
            <div className="lg:col-span-7 space-y-4">
              <div
                className={`relative aspect-video w-full bg-slate-950 rounded-2xl overflow-hidden flex items-center justify-center transition-all ${
                  isSpoofFlagged
                    ? 'scanner-box-spoof'
                    : isVerifiedMatch
                    ? 'scanner-box-verified'
                    : 'scanner-box-safe'
                }`}
              >
                <video
                  ref={videoRef}
                  playsInline
                  muted
                  autoPlay
                  style={{ filter: `brightness(${brightnessBoost}%) contrast(106%)` }}
                  className={`w-full h-full object-cover transform scale-x-[-1] ${cameraOn ? 'block' : 'hidden'}`}
                />
                <canvas ref={canvasRef} className="hidden" />
                <canvas
                  ref={overlayCanvasRef}
                  className={`absolute inset-0 w-full h-full pointer-events-none ${cameraOn ? 'block' : 'hidden'}`}
                />

                {!cameraOn && (
                  <div className="text-center p-8 max-w-md space-y-4">
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-slate-900 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                      <IconCamera className="w-8 h-8" />
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Camera Ready for Biometric Scan</h3>
                      <p className="text-xs text-slate-400 mt-1">
                        Look directly into the camera. If multiple students appear on screen, only the nearest student to the camera is selected and captured.
                      </p>
                    </div>
                    <button
                      onClick={startCamera}
                      disabled={!geoAccess.allowed}
                      className="brand-gradient text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow hover:opacity-95 disabled:opacity-50 cursor-pointer"
                    >
                      Activate Webcam
                    </button>
                    {camError && (
                      <div className="p-3 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs text-left">
                        {camError}
                      </div>
                    )}
                  </div>
                )}

                {cameraOn && (
                  <div className="absolute inset-0 pointer-events-none">
                    {/* Animated Scan Beam */}
                    <div
                      className={`absolute inset-x-0 h-1 bg-gradient-to-r from-transparent ${
                        isSpoofFlagged
                          ? 'via-rose-500 shadow-[0_0_20px_#f43f5e]'
                          : isChallengeActive
                          ? 'via-amber-400 shadow-[0_0_20px_#f59e0b]'
                          : isVerifiedMatch
                          ? 'via-emerald-400 shadow-[0_0_20px_#34d399]'
                          : 'via-cyan-400 shadow-[0_0_18px_#22d3ee]'
                      } to-transparent animate-scan-line`}
                    />

                    {/* Top HUD Pill */}
                    <div className="absolute top-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2">
                      <div className="flex flex-wrap items-center gap-1.5">
                        <span className="px-3 py-1 rounded-lg bg-slate-950/85 backdrop-blur-md border border-slate-700/80 text-[11px] font-mono text-cyan-300">
                          {faceDetected
                            ? multiFaceInfo.total > 1
                              ? `MULTI-FACE (${multiFaceInfo.total}) · NEAREST LOCKED`
                              : 'FACE LOCKED · AI AGENT ACTIVE'
                            : 'SCANNING FOR LIVE FACE...'}
                        </span>

                        {multiFaceInfo.ignoredCount > 0 && (
                          <span className="px-2.5 py-1 rounded-lg bg-amber-950/90 backdrop-blur-md border border-amber-500/60 text-[10px] font-mono font-bold text-amber-300">
                            {multiFaceInfo.ignoredCount} Farther Ignored
                          </span>
                        )}
                      </div>

                      {faceDetected && (
                        <span
                          className={`px-3 py-1 rounded-lg backdrop-blur-md text-[11px] font-mono font-bold border ${
                            isSpoofFlagged
                              ? 'bg-rose-950/90 border-rose-500 text-rose-200'
                              : isChallengeActive
                              ? 'bg-amber-950/90 border-amber-500 text-amber-200'
                              : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'
                          }`}
                        >
                          {isSpoofFlagged
                            ? `⚠️ SPOOF RISK ${livenessState.suspiciousScore}%`
                            : isChallengeActive
                            ? '🤖 TURN HEAD SLIGHTLY'
                            : `✓ REAL HUMAN ${livenessState.authenticityScore}%`}
                        </span>
                      )}
                    </div>

                    {/* Active AI Agent 3D Head-Parallax Challenge Prompt (Prevents False Spoof Blocks!) */}
                    {isChallengeActive && (
                      <div className="absolute inset-x-4 top-14 bg-amber-950/95 border-2 border-amber-400 rounded-xl p-3 text-white shadow-2xl">
                        <div className="flex items-center gap-2 text-amber-300 font-extrabold text-xs uppercase tracking-wider">
                          <span>🤖 Active AI Liveness Check — Confirm 3D Presence</span>
                        </div>
                        <p className="text-[11px] text-amber-100 mt-1">
                          {livenessState.challengePrompt || 'Gently turn or nod your head slightly so the AI Agent can confirm 3D depth.'}
                        </p>
                      </div>
                    )}

                    {/* Spoof Warning Overlay Banner */}
                    {isSpoofFlagged && (
                      <div className="absolute inset-x-4 top-14 bg-rose-950/95 border-2 border-rose-500 rounded-xl p-3.5 text-white shadow-2xl">
                        <div className="flex items-center gap-2 text-rose-300 font-extrabold text-xs uppercase tracking-wider">
                          <IconAlert className="w-5 h-5 text-rose-400 shrink-0" />
                          <span>Suspicious Attendance Blocked — Mobile Screen / Photo Detected</span>
                        </div>
                        <p className="text-[11px] text-rose-100 mt-1">
                          AI detected presentation attack anomalies ({livenessState.flags.join(', ') || '2D display signature'}). Attendance will not be recorded.
                        </p>
                      </div>
                    )}

                    {/* Bottom Identity & Match Bar */}
                    {faceDetected && matchState && !isSpoofFlagged && (
                      <div className="absolute bottom-3 inset-x-3 bg-slate-950/90 backdrop-blur-md border border-cyan-500/30 rounded-xl p-3 text-white flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold">
                            {matchState.isMatch && matchState.person
                              ? `${matchState.person.name} (${matchState.person.id})`
                              : 'Unregistered Face'}
                            {multiFaceInfo.total > 1 ? ' · Nearest Student' : ''}
                          </div>
                          <div className="text-[11px] text-cyan-300 font-mono">
                            {isChallengeActive
                              ? 'Slightly turn/nod head to finish AI liveness check...'
                              : matchState.isMatch
                              ? 'Verified Real Human — Capturing attendance photo...'
                              : 'No matching student profile above threshold'}
                          </div>
                        </div>
                        <div className="text-right font-mono">
                          <div className="text-sm font-extrabold text-cyan-400">{matchState.confidence}%</div>
                          <div className="text-[10px] text-slate-400">SIMILARITY</div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Camera Low-Light Brightness Boost Control */}
              <div className="bg-white dark:bg-[#091226] px-4 py-3 rounded-xl border border-slate-200 dark:border-[#1A284C] flex flex-wrap items-center justify-between gap-3 text-xs">
                <div className="flex items-center gap-2 font-semibold text-slate-700 dark:text-sky-200">
                  <span>☀️ Camera Exposure / Brightness Boost:</span>
                  <span className="font-mono text-cyan-600 dark:text-cyan-400 font-bold">{brightnessBoost}%</span>
                </div>
                <div className="flex items-center gap-3 flex-1 max-w-xs">
                  <input
                    type="range"
                    min="100"
                    max="200"
                    step="5"
                    value={brightnessBoost}
                    onChange={(e) => setBrightnessBoost(Number(e.target.value))}
                    className="w-full accent-cyan-500 cursor-pointer"
                  />
                  <button
                    type="button"
                    onClick={() => setBrightnessBoost(125)}
                    className="px-2 py-1 rounded bg-slate-100 dark:bg-[#0D1836] text-[11px] font-medium hover:bg-slate-200 dark:hover:bg-[#132247] cursor-pointer"
                  >
                    Auto
                  </button>
                </div>
              </div>

              {/* Latest Verified Live Capture Confirmation Card */}
              {lastVerifiedCard && (
                <div className="bg-emerald-500/10 border border-emerald-500/40 rounded-2xl p-4 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3.5">
                    <img
                      src={lastVerifiedCard.capturedPhotoUrl}
                      alt="Verified capture"
                      className="w-20 h-15 rounded-xl object-cover border-2 border-emerald-500 shadow"
                    />
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-sm text-slate-900 dark:text-white">
                          {lastVerifiedCard.personName}
                        </span>
                        <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-700 dark:text-emerald-300">
                          Photo Saved to DB
                        </span>
                      </div>
                      <p className="text-xs text-slate-600 dark:text-sky-200/80 mt-0.5">
                        {lastVerifiedCard.personId} · {lastVerifiedCard.department}
                        {lastVerifiedCard.periodName ? ` · ${lastVerifiedCard.periodName}` : ''} ·{' '}
                        {new Date(lastVerifiedCard.timestamp).toLocaleTimeString()}
                      </p>
                      <p className="text-[11px] font-mono text-emerald-600 dark:text-emerald-400 mt-0.5">
                        Match: {lastVerifiedCard.confidence}% · AI Authenticity: {lastVerifiedCard.livenessScore}%
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={onOpenCaptureDb}
                    className="px-3 py-2 rounded-xl bg-slate-900 dark:bg-[#0D1836] text-white text-xs font-semibold border border-slate-700 hover:border-cyan-400 cursor-pointer shrink-0"
                  >
                    {isAdmin ? 'View in DB' : 'Admin DB'}
                  </button>
                </div>
              )}
            </div>

            {/* Right 5 Cols: Active AI Agent Console + Telemetry + Today's Present List */}
            <div className="lg:col-span-5 space-y-5">
              {/* Active AI Agent & Anti-Spoof Telemetry Card */}
              <div className="bg-white dark:bg-[#091226] p-5 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-4 shadow-sm">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-[#1A284C] pb-3">
                  <div className="flex items-center gap-2">
                    <IconShield className="w-5 h-5 text-cyan-500" />
                    <h2 className="font-bold text-sm text-slate-900 dark:text-white">
                      Active AI Liveness &amp; Anti-Spoof Agent
                    </h2>
                  </div>
                  <span
                    className={`text-[11px] font-mono font-bold px-2 py-0.5 rounded ${
                      !faceDetected
                        ? 'bg-slate-100 dark:bg-[#0D1836] text-slate-500'
                        : livenessState.isSuspicious
                        ? 'bg-rose-500/20 text-rose-500'
                        : isChallengeActive
                        ? 'bg-amber-500/20 text-amber-500'
                        : 'bg-emerald-500/20 text-emerald-500'
                    }`}
                  >
                    {!faceDetected ? 'IDLE' : livenessState.verdict}
                  </span>
                </div>

                {/* Live Active AI Agent Reasoning Box */}
                <div className="p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-xs space-y-1">
                  <div className="flex items-center justify-between font-bold text-cyan-700 dark:text-cyan-300">
                    <span>🤖 AI Agent Decision: {faceDetected ? livenessState.agentDecision : 'STANDBY'}</span>
                    <span className="font-mono text-[10px]">
                      {multiFaceInfo.total > 1 ? `Nearest of ${multiFaceInfo.total}` : 'Single Focus'}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-600 dark:text-sky-200/85 leading-relaxed">
                    {faceDetected
                      ? livenessState.agentReason
                      : 'Monitoring camera feed. Automatically prioritizes the closest student and verifies real 3D skin & depth cues.'}
                  </p>
                </div>

                {/* Suspiciousness Meter */}
                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold">
                    <span className="text-slate-600 dark:text-sky-200/80">Spoof Risk Score (Threshold: {aiSettings.strictMode ? '54%' : '68%'})</span>
                    <span
                      className={`font-mono font-bold ${
                        livenessState.isSuspicious ? 'text-rose-500' : 'text-emerald-500'
                      }`}
                    >
                      {faceDetected ? `${livenessState.suspiciousScore}%` : '0%'}
                    </span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-200 dark:bg-[#0D1836] rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-300 ${
                        livenessState.isSuspicious ? 'bg-rose-500' : isChallengeActive ? 'bg-amber-400' : 'bg-emerald-500'
                      }`}
                      style={{ width: `${faceDetected ? livenessState.suspiciousScore : 0}%` }}
                    />
                  </div>
                </div>

                {/* Diagnostic Signals */}
                <div className="grid grid-cols-2 gap-2.5 text-xs">
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200/70 dark:border-[#1A284C]">
                    <div className="text-[11px] text-slate-500 dark:text-sky-300/70">Screen Moiré Grid Risk</div>
                    <div className="font-mono font-bold text-sm mt-0.5">
                      {faceDetected ? `${livenessState.metrics.moire}%` : '--'}
                    </div>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200/70 dark:border-[#1A284C]">
                    <div className="text-[11px] text-slate-500 dark:text-sky-300/70">Glare &amp; Bezel Edge Risk</div>
                    <div className="font-mono font-bold text-sm mt-0.5">
                      {faceDetected ? `${livenessState.metrics.glare}%` : '--'}
                    </div>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200/70 dark:border-[#1A284C]">
                    <div className="text-[11px] text-slate-500 dark:text-sky-300/70">3D Depth &amp; Parallax</div>
                    <div className="font-mono font-bold text-sm mt-0.5 text-cyan-600 dark:text-cyan-400">
                      {faceDetected ? `${livenessState.metrics.depth}%` : '--'}
                    </div>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200/70 dark:border-[#1A284C]">
                    <div className="text-[11px] text-slate-500 dark:text-sky-300/70">Natural Skin Chrominance</div>
                    <div className="font-mono font-bold text-sm mt-0.5 text-emerald-600 dark:text-emerald-400">
                      {faceDetected ? `${livenessState.metrics.skinTone ?? 90}%` : '--'}
                    </div>
                  </div>
                </div>

                {faceDetected && livenessState.flags.length > 0 && (
                  <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-600 dark:text-rose-300 space-y-1">
                    <div className="font-bold">Detected Spoof Indicators:</div>
                    <ul className="list-disc list-inside text-[11px]">
                      {livenessState.flags.map((fl, i) => (
                        <li key={i}>{fl}</li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>

              {/* Present Students Today */}
              <div className="bg-white dark:bg-[#091226] p-5 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-3 shadow-sm">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-[#1A284C] pb-3">
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">Present Students Today</h3>
                  <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300">
                    {todayLogs.length} Verified
                  </span>
                </div>

                {todayLogs.length === 0 ? (
                  <p className="text-xs text-slate-500 dark:text-sky-300/70 py-6 text-center">
                    No attendance recorded yet today. Start the scanner to verify your face.
                  </p>
                ) : (
                  <ul className="divide-y divide-slate-100 dark:divide-[#172548] max-h-64 overflow-y-auto">
                    {todayLogs.map((log) => (
                      <li key={log.id} className="py-2.5 flex items-center justify-between gap-3">
                        <div className="flex items-center gap-2.5 min-w-0">
                          {isAdmin && log.capturedPhotoUrl ? (
                            <img
                              src={log.capturedPhotoUrl}
                              alt={log.personName}
                              className="w-9 h-9 rounded-full object-cover border border-emerald-500 shrink-0"
                            />
                          ) : (
                            <div className="w-9 h-9 rounded-full bg-cyan-500/15 text-cyan-600 dark:text-cyan-300 font-bold text-xs flex items-center justify-center shrink-0">
                              {log.personName.charAt(0)}
                            </div>
                          )}
                          <div className="min-w-0">
                            <div className="text-xs font-bold text-slate-900 dark:text-white truncate">
                              {log.personName}
                            </div>
                            <div className="text-[11px] font-mono text-slate-500 dark:text-sky-300/60">
                              {log.personId}
                              {log.periodName ? ` · ${log.periodName}` : ''} · Live {log.livenessScore}%
                            </div>
                          </div>
                        </div>
                        <span className="text-[11px] font-mono text-emerald-600 dark:text-emerald-400 shrink-0">
                          {new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================================
       VIEW 2: ADMIN CAPTURED ATTENDANCE PHOTOS DATABASE (VIEW & DELETE)
    ============================================================================ */
    function AdminCaptureDatabaseView({
      capturesDb,
      onDeleteCapture,
      onDeleteSelected,
      onClearAllCaptures
    }) {
      const [search, setSearch] = useState('');
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [previewItem, setPreviewItem] = useState(null);

      const filtered = capturesDb.filter(
        (item) =>
          item.studentName.toLowerCase().includes(search.toLowerCase()) ||
          item.studentId.toLowerCase().includes(search.toLowerCase()) ||
          (item.department || '').toLowerCase().includes(search.toLowerCase())
      );

      const toggleSelect = (captureId) => {
        setSelectedIds((prev) => {
          const next = new Set(prev);
          if (next.has(captureId)) next.delete(captureId);
          else next.add(captureId);
          return next;
        });
      };

      const exportDatabaseJson = () => {
        const blob = new Blob([JSON.stringify(capturesDb, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `faceguard_attendance_captures_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          {/* Header Banner */}
          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2.5">
                <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">
                  Attendance Photo Captures Database
                </h2>
                <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-600 dark:text-cyan-300 border border-cyan-500/30">
                  {capturesDb.length} Captured Records
                </span>
              </div>
              <p className="text-xs text-slate-500 dark:text-sky-300/70 mt-1">
                Every student who passes live face recognition and the AI Anti-Spoofing check has their live verification photo automatically clicked and stored here. Only Admins can view or delete these records.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button
                onClick={exportDatabaseJson}
                disabled={capturesDb.length === 0}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-300 dark:border-[#1E3A8A] bg-slate-50 dark:bg-[#0D1836] disabled:opacity-50 cursor-pointer"
              >
                Export DB JSON
              </button>

              {selectedIds.size > 0 && (
                <button
                  onClick={() => {
                    onDeleteSelected(selectedIds);
                    setSelectedIds(new Set());
                  }}
                  className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-amber-600 text-white hover:bg-amber-700 cursor-pointer flex items-center gap-1.5"
                >
                  <IconTrash className="w-3.5 h-3.5" />
                  <span>Delete Selected ({selectedIds.size})</span>
                </button>
              )}

              <button
                onClick={() => {
                  onClearAllCaptures();
                  setSelectedIds(new Set());
                }}
                disabled={capturesDb.length === 0}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-600 text-white hover:bg-rose-700 disabled:opacity-50 cursor-pointer flex items-center gap-1.5"
              >
                <IconTrash className="w-3.5 h-3.5" />
                <span>Delete All Captures</span>
              </button>
            </div>
          </div>

          {/* Search Filter */}
          <div className="bg-white dark:bg-[#091226] p-4 rounded-2xl border border-slate-200 dark:border-[#1A284C]">
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search captured attendance photos by student name, roll ID, or department..."
              className="w-full md:w-96 px-4 py-2 rounded-xl text-xs bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] text-slate-900 dark:text-white focus:outline-none focus:border-cyan-500"
            />
          </div>

          {/* Photo Grid */}
          {filtered.length === 0 ? (
            <div className="bg-white dark:bg-[#091226] rounded-2xl border border-slate-200 dark:border-[#1A284C] py-16 text-center space-y-2">
              <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 dark:bg-[#0D1836] flex items-center justify-center text-cyan-500">
                <IconDatabase className="w-6 h-6" />
              </div>
              <h3 className="text-base font-bold text-slate-900 dark:text-white">No Captured Photos Found</h3>
              <p className="text-xs text-slate-500 dark:text-sky-300/70 max-w-md mx-auto">
                When a student successfully marks attendance on the Live AI Scanner, their clicked photo is automatically saved to this database.
              </p>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filtered.map((item) => {
                const isSelected = selectedIds.has(item.captureId);
                return (
                  <div
                    key={item.captureId}
                    className={`bg-white dark:bg-[#091226] rounded-2xl border overflow-hidden transition-all shadow-sm flex flex-col justify-between ${
                      isSelected
                        ? 'border-cyan-500 ring-2 ring-cyan-500/40'
                        : 'border-slate-200 dark:border-[#1A284C]'
                    }`}
                  >
                    <div>
                      <div className="relative bg-slate-950 aspect-4/3 overflow-hidden group">
                        <img
                          src={item.capturedPhotoUrl}
                          alt={`${item.studentName} live verification capture`}
                          className="w-full h-full object-cover"
                        />
                        <label className="absolute top-3 left-3 flex items-center gap-1.5 bg-slate-950/80 backdrop-blur-sm px-2.5 py-1 rounded-lg text-[11px] font-semibold text-white cursor-pointer border border-slate-700">
                          <input
                            type="checkbox"
                            checked={isSelected}
                            onChange={() => toggleSelect(item.captureId)}
                            className="accent-cyan-500"
                          />
                          <span>Select</span>
                        </label>

                        <button
                          onClick={() => setPreviewItem(item)}
                          className="absolute top-3 right-3 p-2 rounded-lg bg-slate-950/80 text-cyan-300 hover:text-white border border-slate-700 cursor-pointer"
                          title="Inspect Full Photo"
                        >
                          <IconEye className="w-4 h-4" />
                        </button>
                      </div>

                      <div className="p-4 space-y-2.5">
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">{item.studentName}</h3>
                            <p className="text-xs font-mono text-cyan-600 dark:text-cyan-400">
                              {item.studentId} · {item.department}
                              {item.periodName ? ` · ${item.periodName}` : ''}
                            </p>
                          </div>
                          <span className="text-[11px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-600 dark:text-emerald-300">
                            {item.confidence}% Match
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-[11px] font-mono bg-slate-50 dark:bg-[#0B1530] p-2.5 rounded-xl border border-slate-200/70 dark:border-[#1A284C]">
                          <div>
                            <span className="text-slate-400 block">AI Liveness</span>
                            <span className="font-bold text-emerald-500">{item.livenessScore}% Human</span>
                          </div>
                          <div>
                            <span className="text-slate-400 block">Captured At</span>
                            <span className="font-bold text-slate-700 dark:text-sky-100">
                              {new Date(item.timestamp).toLocaleTimeString()}
                            </span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="px-4 py-3 bg-slate-50 dark:bg-[#0B142A] border-t border-slate-200 dark:border-[#1A284C] flex items-center justify-between">
                      <span className="text-[11px] font-mono text-slate-400">
                        {new Date(item.timestamp).toLocaleDateString()}
                      </span>
                      <button
                        onClick={() => {
                          onDeleteCapture(item.captureId);
                          setSelectedIds((prev) => {
                            const next = new Set(prev);
                            next.delete(item.captureId);
                            return next;
                          });
                        }}
                        className="px-3 py-1.5 rounded-lg bg-rose-500/15 text-rose-600 dark:text-rose-300 hover:bg-rose-500/25 text-xs font-semibold flex items-center gap-1.5 cursor-pointer"
                      >
                        <IconTrash className="w-3.5 h-3.5" />
                        <span>Delete Photo</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Full Inspection Modal */}
          {previewItem && (
            <div
              className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setPreviewItem(null)}
            >
              <div

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="space-y-1.5">
                    <div className="text-xs font-bold text-emerald-500">Live Attendance Snapshot</div>
                    <img
                      src={previewItem.capturedPhotoUrl}
                      alt="Live capture"

                  {previewItem.referencePhotoUrl && (
                    <div className="space-y-1.5">
                      <div className="text-xs font-bold text-cyan-500">Enrolled Reference Portrait</div>

                        alt="Reference portrait"
                        className="w-full rounded-xl border border-slate-600 object-cover"

                <div className="flex justify-end gap-3 pt-2">

                  >

    /* ============================================================================
       VIEW 3: ADMIN STUDENT ENROLLMENT (LIVE WEBCAM, PHOTO UPLOAD, EDIT & JSON)
    ============================================================================ */
    function StudentEnrollmentView({ repository, onAddStudent, onImportBulk, onUpdateStudent, onDeleteStudent }) {
      const [name, setName] = useState('');
      const [studentId, setStudentId] = useState('');
      const [dept, setDept] = useState('Electronics & Telecom');
      const [photoDataUrl, setPhotoDataUrl] = useState(null);
      const [descriptor, setDescriptor] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [camActive, setCamActive] = useState(false);

      const [editingStudent, setEditingStudent] = useState(null);
      const [editForm, setEditForm] = useState({ name: '', id: '', department: '', role: 'Student', email: '', status: 'Active' });
      const [editErr, setEditErr] = useState(null);

      const enrollVideoRef = useRef(null);
      const enrollStreamRef = useRef(null);

      const stopEnrollCam = useCallback(() => {
        if (enrollStreamRef.current) {
          enrollStreamRef.current.getTracks().forEach((t) => t.stop());
          enrollStreamRef.current = null;
        }
        if (enrollVideoRef.current) {
          enrollVideoRef.current.srcObject = null;
        }
        setCamActive(false);
      }, []);

      useEffect(() => () => stopEnrollCam(), [stopEnrollCam]);

      const startEnrollCam = async () => {
        setErr(null);
        setPhotoDataUrl(null);
        setDescriptor(null);
        try {
          const stream = await window.FG.openCamera(480, 480);
          enrollStreamRef.current = stream;
          window.FG.attachStream(enrollVideoRef.current, stream);
          setCamActive(true);
        } catch (error) {
          setErr(error.message || 'Could not open webcam.');
        }
      };

      const captureEnrollFrame = async () => {
        const video = enrollVideoRef.current;
        if (!video || !video.videoWidth) return;
        const c = document.createElement('canvas');
        c.width = 480;
        c.height = 480;
        const ctx = c.getContext('2d');
        ctx.filter = 'brightness(122%) contrast(106%)';
        ctx.drawImage(video, 0, 0, c.width, c.height);
        ctx.filter = 'none';
        window.FG.autoEnhanceFrame(c);

        stopEnrollCam();
        setBusy(true);
        setErr(null);
        try {
          const res = await window.FG.describeCanvas(c);
          if (!res) {
            setErr('No clear face detected in camera frame. Ensure bright lighting and face forward.');
            setBusy(false);
            return;
          }
          setPhotoDataUrl(c.toDataURL('image/jpeg', 0.9));
          setDescriptor(res.descriptor);
        } catch (error) {
          setErr('Failed to extract face vector from camera capture.');
        } finally {
          setBusy(false);
        }
      };

      const handlePhotoUpload = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        stopEnrollCam();
        setBusy(true);
        setErr(null);
        try {
          const canvas = await window.FG.fileToCanvas(file, 480);
          const res = await window.FG.describeCanvas(canvas);
          if (!res) {
            setErr('No clear face detected in that image. Please choose a front-facing portrait.');
            setBusy(false);
            return;
          }
          setPhotoDataUrl(canvas.toDataURL('image/jpeg', 0.88));
          setDescriptor(res.descriptor);
        } catch (error) {
          setErr('Could not process the selected image.');
        } finally {
          setBusy(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          setErr('Please enter the student full name.');
          return;
        }
        if (!photoDataUrl || !descriptor) {
          setErr('Please capture via webcam or upload a clear face photo first.');
          return;
        }
        const id = studentId.trim() || 'STU-' + Math.floor(1000 + Math.random() * 9000);
        onAddStudent({
          id,
          name: name.trim(),
          department: dept.trim() || 'General',
          role: 'Student',
          email: '',
          photoUrl: photoDataUrl,
          embedding: descriptor,
          status: 'Active'
        });
        setName('');
        setStudentId('');
        setPhotoDataUrl(null);
        setDescriptor(null);
      };

      const handleExportJson = () => {
        const blob = new Blob([JSON.stringify(repository, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `faceguard_repository_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJson = (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const parsed = JSON.parse(ev.target?.result);
            if (!Array.isArray(parsed) || parsed.length === 0 || !parsed[0].name) {
              setErr('Invalid JSON file. Expected an array of student profiles.');
              return;
            }
            setBusy(true);
            setErr(null);
            await window.FG.ready;
            const hydrated = await Promise.all(
              parsed.map(async (item) => {
                if (item.embedding && item.embedding.length === 128) return item;
                try {
                  const res = await window.FG.describeImage(item.photoUrl);
                  return { ...item, embedding: res.descriptor };
                } catch (err2) {
                  return item;
                }
              })
            );
            onImportBulk(hydrated);
            setBusy(false);
          } catch (err3) {
            setErr('Could not parse JSON repository file.');
            setBusy(false);
          }
        };
        reader.readAsText(file);
      };

      const openEditModal = (stu) => {
        setEditingStudent(stu);
        setEditForm({
          name: stu.name || '',
          id: stu.id || '',
          department: stu.department || 'General',
          role: stu.role || 'Student',
          email: stu.email || '',
          status: stu.status || 'Active'
        });
        setEditErr(null);
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        const trimmedName = editForm.name.trim();
        const trimmedId = editForm.id.trim();
        if (!trimmedName) {
          setEditErr('Full name is required.');
          return;
        }
        if (!trimmedId) {
          setEditErr('Roll ID / Employee ID is required.');
          return;
        }
        if (
          trimmedId.toLowerCase() !== String(editingStudent.id).toLowerCase() &&
          repository.some((s) => String(s.id).toLowerCase() === trimmedId.toLowerCase())
        ) {
          setEditErr('Another profile already uses this ID.');
          return;
        }
        onUpdateStudent(editingStudent.id, {
          name: trimmedName,
          id: trimmedId,
          department: editForm.department.trim() || 'General',
          role: editForm.role.trim() || 'Student',
          email: editForm.email.trim(),
          status: editForm.status
        });
        setEditingStudent(null);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-lg font-bold text-slate-900 dark:text-white">Enroll or Update Student Biometric Profile</h2>
              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={handleExportJson}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-300 dark:border-[#1E3A8A] bg-slate-50 dark:bg-[#0D1836] cursor-pointer"
                >
                  Export JSON
                </button>
                <label className="px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-300 dark:border-[#1E3A8A] bg-slate-50 dark:bg-[#0D1836] cursor-pointer">
                  <span>Import JSON</span>
                  <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                </label>
              </div>
            </div>
            {err && (
              <div className="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-500 text-xs font-medium">
                {err}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Student Full Name *"
                  className="px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                />
                <input
                  type="text"
                  value={studentId}
                  onChange={(e) => setStudentId(e.target.value)}
                  placeholder="Roll ID (e.g. BTEL26O1112)"
                  className="px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                />
                <input
                  type="text"
                  value={dept}
                  onChange={(e) => setDept(e.target.value)}
                  placeholder="Department / Branch"
                  className="px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                />
              </div>

              <div className="flex flex-wrap items-center gap-3">
                {!camActive ? (
                  <button
                    type="button"
                    onClick={startEnrollCam}
                    className="px-4 py-2.5 rounded-xl border border-cyan-500/40 bg-cyan-500/15 text-cyan-600 dark:text-cyan-300 font-semibold cursor-pointer"
                  >
                    Capture via Live Camera (Recommended)
                  </button>
                ) : (
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={captureEnrollFrame}
                      className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer"
                    >
                      Snap Face Frame
                    </button>
                    <button
                      type="button"
                      onClick={stopEnrollCam}
                      className="px-3 py-2.5 rounded-xl bg-slate-700 text-white font-semibold cursor-pointer"
                    >
                      Cancel
                    </button>
                  </div>
                )}

                <label className="px-4 py-2.5 rounded-xl border border-slate-300 dark:border-[#1E3A8A] bg-slate-50 dark:bg-[#0D1836] font-semibold cursor-pointer">
                  <span>{busy ? 'Extracting 128-D Face Vector...' : 'Or Upload Portrait Photo'}</span>
                  <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                </label>

                <button
                  type="submit"
                  disabled={busy || !descriptor}
                  className="brand-gradient text-white font-bold px-5 py-2.5 rounded-xl shadow disabled:opacity-50 cursor-pointer"
                >
                  Save Profile to Repository
                </button>
              </div>

              <div className="flex items-center gap-4">
                <video
                  ref={enrollVideoRef}
                  playsInline
                  muted
                  autoPlay
                  className={`w-36 h-36 rounded-2xl object-cover border-2 border-cyan-500 transform scale-x-[-1] ${
                    camActive ? 'block' : 'hidden'
                  }`}
                />
                {photoDataUrl && (
                  <div className="flex items-center gap-3">
                    <img src={photoDataUrl} alt="Preview" className="w-20 h-20 rounded-xl object-cover border-2 border-emerald-500" />
                    <span className="text-emerald-500 font-semibold">128-D Biometric Vector Ready</span>
                  </div>
                )}
              </div>
            </form>
          </div>

          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-4">
            <h3 className="text-base font-bold text-slate-900 dark:text-white">
              Enrolled Repository ({repository.length})
            </h3>
            <div className="divide-y divide-slate-100 dark:divide-[#172548]">
              {repository.map((stu) => (
                <div key={stu.id} className="py-3 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3 min-w-0">
                    <img src={stu.photoUrl} alt={stu.name} className="w-11 h-11 rounded-full object-cover border border-cyan-500/40 shrink-0" />
                    <div className="min-w-0">
                      <div className="text-sm font-bold text-slate-900 dark:text-white truncate">{stu.name}</div>
                      <div className="text-xs font-mono text-slate-500">
                        {stu.id} · {stu.department} {stu.email ? `· ${stu.email}` : ''} {stu.embedding ? '· 128-D Ready' : '· Extracting...'}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      type="button"
                      onClick={() => openEditModal(stu)}
                      className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500/15 text-cyan-600 dark:text-cyan-300 border border-cyan-500/30 hover:bg-cyan-500/25 cursor-pointer"
                    >
                      Edit
                    </button>
                    <button
                      type="button"
                      onClick={() => onDeleteStudent(stu.id)}
                      className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/15 text-rose-500 hover:bg-rose-500/25 cursor-pointer"
                    >
                      Remove
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {editingStudent && (
            <div
              className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setEditingStudent(null)}
            >
              <form
                onSubmit={handleSaveEdit}
                onClick={(e) => e.stopPropagation()}
                className="bg-white dark:bg-[#091226] border border-slate-200 dark:border-[#1E3A8A] rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl"
              >
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-[#1A284C] pb-3">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white">Edit Enrolled Profile</h3>
                    <p className="text-xs text-slate-500 dark:text-sky-300/70">
                      Update student details without altering their biometric face vector.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setEditingStudent(null)}
                    className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                {editErr && (
                  <div className="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-500 text-xs font-medium">
                    {editErr}
                  </div>
                )}

                <div className="flex items-center gap-3">
                  <img
                    src={editingStudent.photoUrl}
                    alt={editingStudent.name}
                    className="w-14 h-14 rounded-full object-cover border-2 border-cyan-500/50"
                  />
                  <div className="text-xs text-slate-500 dark:text-sky-300/70">
                    Editing <strong>{editingStudent.name}</strong> ({editingStudent.id})
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Full Name *</span>
                    <input
                      type="text"
                      value={editForm.name}
                      onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                    />
                  </label>
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Roll ID / ID *</span>
                    <input
                      type="text"
                      value={editForm.id}
                      onChange={(e) => setEditForm({ ...editForm, id: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                    />
                  </label>
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Department / Branch</span>
                    <input
                      type="text"
                      value={editForm.department}
                      onChange={(e) => setEditForm({ ...editForm, department: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                    />
                  </label>
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Role</span>
                    <select
                      value={editForm.role}
                      onChange={(e) => setEditForm({ ...editForm, role: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                    >
                      <option value="Student">Student</option>
                      <option value="Professor">Professor</option>
                      <option value="Staff">Staff</option>
                    </select>
                  </label>
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Email Address</span>
                    <input
                      type="email"
                      value={editForm.email}
                      onChange={(e) => setEditForm({ ...editForm, email: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                    />
                  </label>
                  <label className="space-y-1">
                    <span className="font-semibold text-slate-700 dark:text-sky-200 block">Status</span>
                    <select
                      value={editForm.status}
                      onChange={(e) => setEditForm({ ...editForm, status: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                    >
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive</option>
                    </select>
                  </label>
                </div>

                <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-200 dark:border-[#1A284C]">
                  <button
                    type="button"
                    onClick={() => setEditingStudent(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-sky-200 cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="brand-gradient text-white text-xs font-semibold px-5 py-2 rounded-xl shadow cursor-pointer"
                  >
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }
