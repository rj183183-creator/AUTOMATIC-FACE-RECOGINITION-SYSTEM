<body class="bg-slate-50 text-slate-800 dark:bg-[#070d1e] dark:text-sky-100 antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <!-- Standalone Browser OpenCV YuNet + SFace Engine + Adaptive Low-Light Enhancer + AI Anti-Spoofing -->
  <script>
    (function () {
      let statusBanner = null;
      let hideTimer = null;
      let modelsReady = false;

      function setEngineStatus(msg, kind, autoHideMs) {
        try {
          if (!statusBanner) {
            statusBanner = document.createElement('div');
            statusBanner.setAttribute('role', 'status');
            statusBanner.style.cssText =
              'position:fixed;left:14px;bottom:14px;z-index:80;max-width:360px;padding:9px 14px;border-radius:10px;font:600 12px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:opacity 0.2s;';
            document.body.appendChild(statusBanner);
          }
          clearTimeout(hideTimer);
          statusBanner.textContent = msg;
          statusBanner.style.display = 'block';
          statusBanner.style.background =
            kind === 'err' ? '#881337' : kind === 'ok' ? '#065f46' : '#0c4a6e';
          statusBanner.style.color = '#fff';
          if (autoHideMs) {
            hideTimer = setTimeout(() => {
              statusBanner.style.display = 'none';
            }, autoHideMs);
          }
        } catch (e) {}
      }

      const ORT_BASES = [
        'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/',
        'https://unpkg.com/onnxruntime-web@1.17.3/dist/'
      ];
      const MODEL_URLS = {
        yunet: [
          'https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx',
          'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx'
        ],
        sface: [
          'https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec.onnx',
          'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx'
        ]
      };

      let detSession = null;
      let recSession = null;
      let workQueue = Promise.resolve();

      function enqueue(fn) {
        const next = workQueue.then(fn);
        workQueue = next.catch(() => {});
        return next;
      }

      function loadOrt(idx) {
        return new Promise((resolve, reject) => {
          if (window.ort) return resolve(ORT_BASES[0]);
          if (idx >= ORT_BASES.length) return reject(new Error('ONNX Runtime failed to load'));
          const script = document.createElement('script');
          script.src = ORT_BASES[idx] + 'ort.min.js';
          script.onload = () => {
            ort.env.wasm.wasmPaths = ORT_BASES[idx];
            ort.env.wasm.numThreads = 1;
            ort.env.logLevel = 'error';
            resolve(ORT_BASES[idx]);
          };
          script.onerror = () => loadOrt(idx + 1).then(resolve, reject);
          document.head.appendChild(script);
        });
      }

      async function fetchModel(key) {
        let cache = null;
        try { cache = await caches.open('faceguard-opencv-models-v2'); } catch (e) {}
        const urls = MODEL_URLS[key];
        let lastErr;
        for (let i = 0; i < urls.length; i++) {
          try {
            if (cache) {
              const hit = await cache.match(urls[i]);
              if (hit) {
                const hb = await hit.arrayBuffer();
                if (hb.byteLength > 100000) return hb;
              }
            }
            const res = await fetch(urls[i]);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const total = +res.headers.get('content-length') || 0;
            const reader = res.body && res.body.getReader();
            const chunks = [];
            let got = 0;
            if (reader) {
              for (;;) {
                const c = await reader.read();
                if (c.done) break;
                chunks.push(c.value);
                got += c.value.length;
                if (total) {
                  setEngineStatus('Downloading ' + key.toUpperCase() + ' neural weights... ' + Math.round((got * 100) / total) + '%', 'info');
                }
              }
            }
            const buf = reader ? await new Blob(chunks).arrayBuffer() : await res.arrayBuffer();
            if (buf.byteLength < 100000) throw new Error('Corrupted model');
            if (cache) {
              try { await cache.put(urls[i], new Response(buf)); } catch (e) {}
            }
            return buf;
          } catch (e) {
            lastErr = e;
          }
        }
        throw lastErr || new Error('Model download failed');
      }

      let readyResolve;
      const ready = new Promise((res) => { readyResolve = res; });

      (async function initModels() {
        setEngineStatus('Initializing FaceGuard AI Biometrics & Anti-Spoof Engine...', 'info');
        try {
          await loadOrt(0);
          const [yb, sb] = await Promise.all([fetchModel('yunet'), fetchModel('sface')]);
          const opts = {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all',
            logSeverityLevel: 3
          };
          detSession = await ort.InferenceSession.create(new Uint8Array(yb), opts);
          recSession = await ort.InferenceSession.create(new Uint8Array(sb), opts);
          modelsReady = true;
          setEngineStatus('FaceGuard AI & Anti-Spoofing Shield Ready', 'ok', 2800);
          readyResolve();
        } catch (err) {
          console.warn('Model load warning:', err);
          setEngineStatus('Offline mode: Could not download neural weights.', 'err', 7000);
        }
      })();

      /* ---- YuNet Detection ---- */
      const S = 640;
      const lbCanvas = document.createElement('canvas');
      lbCanvas.width = lbCanvas.height = S;
      const lbCtx = lbCanvas.getContext('2d', { willReadFrequently: true });

      function iou(p, q) {
        const x1 = Math.max(p.x, q.x), y1 = Math.max(p.y, q.y);
        const x2 = Math.min(p.x + p.w, q.x + q.w), y2 = Math.min(p.y + p.h, q.y + q.h);
        const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
        return inter / (p.w * p.h + q.w * q.h - inter + 1e-9);
      }

      function nms(cands, thresh) {
        cands.sort((a, b) => b.score - a.score);
        const keep = [];
        for (let i = 0; i < cands.length; i++) {
          let ok = true;
          for (let j = 0; j < keep.length; j++) {
            if (iou(cands[i], keep[j]) > thresh) { ok = false; break; }
          }
          if (ok) keep.push(cands[i]);
        }
        return keep;
      }

      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

      async function detectRaw(src, frac, thr) {
        const w = src.width, h = src.height;
        const k = Math.min(S / w, S / h) * frac;
        const dw = w * k, dh = h * k, ox = (S - dw) / 2, oy = (S - dh) / 2;
        lbCtx.fillStyle = '#808080';
        lbCtx.fillRect(0, 0, S, S);
        lbCtx.drawImage(src, ox, oy, dw, dh);
        const d = lbCtx.getImageData(0, 0, S, S).data;
        const n = S * S;
        const f = new Float32Array(3 * n);
        for (let i = 0; i < n; i++) {
          f[i] = d[i * 4 + 2];
          f[n + i] = d[i * 4 + 1];
          f[2 * n + i] = d[i * 4];
        }
        const feeds = {};
        feeds[detSession.inputNames[0]] = new ort.Tensor('float32', f, [1, 3, S, S]);
        const out = await detSession.run(feeds);
        const get = (nm, ix) => (out[nm] || out[detSession.outputNames[ix]]).data;
        const cands = [];
        [8, 16, 32].forEach((stride, si) => {
          const cls = get('cls_' + stride, si);
          const obj = get('obj_' + stride, 3 + si);
          const bb = get('bbox_' + stride, 6 + si);
          const kp = get('kps_' + stride, 9 + si);
          const cols = S / stride;
          for (let r = 0; r < cols; r++) {
            for (let c = 0; c < cols; c++) {
              const ix = r * cols + c;
              const sc = Math.sqrt(clamp01(cls[ix]) * clamp01(obj[ix]));
              if (sc < thr) continue;
              const cx = (c + bb[ix * 4]) * stride;
              const cy = (r + bb[ix * 4 + 1]) * stride;
              const bw = Math.exp(bb[ix * 4 + 2]) * stride;
              const bh = Math.exp(bb[ix * 4 + 3]) * stride;
              const kps = [];
              for (let q = 0; q < 5; q++) {
                kps.push([
                  ((kp[ix * 10 + 2 * q] + c) * stride - ox) / k,
                  ((kp[ix * 10 + 2 * q + 1] + r) * stride - oy) / k
                ]);
              }
              cands.push({
                x: (cx - bw / 2 - ox) / k,
                y: (cy - bh / 2 - oy) / k,
                w: bw / k,
                h: bh / k,
                score: sc,
                kps: kps
              });
            }
          }
        });
        return nms(cands, 0.3);
      }

      /* ---- Adaptive Low-Light Brightness & Contrast Enhancer ---- */
      function autoEnhanceFrame(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        if (!w || !h) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        let sumLuma = 0;
        let samples = 0;
        const xStart = Math.floor(w * 0.25);
        const xEnd = Math.floor(w * 0.75);
        const yStart = Math.floor(h * 0.2);
        const yEnd = Math.floor(h * 0.8);

        for (let y = yStart; y < yEnd; y += 4) {
          for (let x = xStart; x < xEnd; x += 4) {
            const idx = (y * w + x) * 4;
            sumLuma += 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
            samples++;
          }
        }
        const avgLuma = samples > 0 ? sumLuma / samples : 128;

        if (avgLuma < 126) {
          const targetLuma = 136;
          const gain = Math.min(2.4, Math.max(1.12, targetLuma / Math.max(22, avgLuma)));
          const gamma = avgLuma < 75 ? 0.66 : 0.78;
          const lut = new Uint8ClampedArray(256);
          for (let i = 0; i < 256; i++) {
            const normalized = i / 255;
            const boosted = Math.pow(normalized, gamma) * 255 * Math.min(1.48, gain * 0.74) + 10;
            lut[i] = Math.min(255, Math.max(0, Math.round(boosted)));
          }
          for (let i = 0; i < data.length; i += 4) {
            data[i] = lut[data[i]];
            data[i + 1] = lut[data[i + 1]];
            data[i + 2] = lut[data[i + 2]];
          }
          ctx.putImageData(imgData, 0, 0);
        }
      }

      /* ---- SFace 128-D Alignment & Embedding ---- */
      const TPL = [
        [38.2946, 51.6963],
        [73.5318, 51.5014],
        [56.0252, 71.7366],
        [41.5493, 92.3655],
        [70.7299, 92.2041]
      ];
      function simTransform(P, Q) {
        const n = P.length;
        let px = 0, py = 0, qx = 0, qy = 0;
        for (let i = 0; i < n; i++) { px += P[i][0]; py += P[i][1]; qx += Q[i][0]; qy += Q[i][1]; }
        px /= n; py /= n; qx /= n; qy /= n;
        let num1 = 0, num2 = 0, den = 0;
        for (let i = 0; i < n; i++) {
          const ax = P[i][0] - px, ay = P[i][1] - py, bx = Q[i][0] - qx, by = Q[i][1] - qy;
          num1 += ax * bx + ay * by;
          num2 += ax * by - ay * bx;
          den += ax * ax + ay * ay;
        }
        const a = num1 / den, b = num2 / den;
        return { a, b, tx: qx - (a * px - b * py), ty: qy - (b * px + a * py) };
      }

      const alignCanvas = document.createElement('canvas');
      alignCanvas.width = alignCanvas.height = 112;
      const alignCtx = alignCanvas.getContext('2d', { willReadFrequently: true });

      async function embedFace(src, face) {
        const t = simTransform(face.kps, TPL);
        alignCtx.setTransform(1, 0, 0, 1, 0, 0);
        alignCtx.fillStyle = '#000';
        alignCtx.fillRect(0, 0, 112, 112);
        alignCtx.setTransform(t.a, t.b, -t.b, t.a, t.tx, t.ty);
        alignCtx.drawImage(src, 0, 0);
        alignCtx.setTransform(1, 0, 0, 1, 0, 0);
        const d = alignCtx.getImageData(0, 0, 112, 112).data;
        const n = 112 * 112;
        const f = new Float32Array(3 * n);
        for (let i = 0; i < n; i++) {
          f[i] = d[i * 4 + 2];
          f[n + i] = d[i * 4 + 1];
          f[2 * n + i] = d[i * 4];
        }
        const feeds = {};
        feeds[recSession.inputNames[0]] = new ort.Tensor('float32', f, [1, 3, 112, 112]);
        const o = await recSession.run(feeds);
        const v = o[recSession.outputNames[0]].data;
        let norm = 0;
        for (let i = 0; i < v.length; i++) norm += v[i] * v[i];
        norm = Math.sqrt(norm) || 1;
        const res = new Array(v.length);
        for (let i = 0; i < v.length; i++) res[i] = v[i] / norm;
        return res;
      }

      function bestFace(fs, mode = 'nearest', canvasW = 640, canvasH = 480) {
        if (!fs || !fs.length) return null;
        if (fs.length === 1) return fs[0];
        if (mode === 'center') {
          const cx = canvasW / 2, cy = canvasH / 2;
          return fs.reduce((best, cur) => {
            const curArea = cur.w * cur.h;
            const bestArea = best.w * best.h;
            const curDist = Math.hypot(cur.x + cur.w / 2 - cx, cur.y + cur.h / 2 - cy) / Math.max(1, canvasW);
            const bestDist = Math.hypot(best.x + best.w / 2 - cx, best.y + best.h / 2 - cy) / Math.max(1, canvasW);
            const curRank = curArea * (1 - curDist * 0.65);
            const bestRank = bestArea * (1 - bestDist * 0.65);
            return curRank > bestRank ? cur : best;
          });
        }
        // 'nearest' (default): largest bounding box area = physically closest to camera lens
        return fs.reduce((a, b) => (b.w * b.h > a.w * a.h ? b : a));
      }

      function describeCanvas(canvas) {
        return ready.then(() => enqueue(async () => {
          autoEnhanceFrame(canvas);
          const tries = [[1, 0.6], [1, 0.3], [0.5, 0.3]];
          for (let i = 0; i < tries.length; i++) {
            const fs = await detectRaw(canvas, tries[i][0], tries[i][1]);
            if (fs.length) {
              const f = bestFace(fs);
              return {
                descriptor: await embedFace(canvas, f),
                box: { x: f.x, y: f.y, width: f.w, height: f.h },
                kps: f.kps,
                score: f.score
              };
            }
          }
          return null;
        }));
      }

      function describeImage(url) {
        return ready.then(() => new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            const k = Math.min(1, 1280 / Math.max(w, h));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(w * k));
            c.height = Math.max(1, Math.round(h * k));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            describeCanvas(c).then((r) => (r ? resolve(r) : reject(new Error('No face found'))), reject);
          };
          img.onerror = () => reject(new Error('Image load error'));
          img.src = url;
        }));
      }

      function similarity(a, b) {
        if (!a || !b || a.length !== 128 || b.length !== 128) return 0;
        let d = 0, na = 0, nb = 0;
        for (let i = 0; i < 128; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
        const cos = d / (Math.sqrt(na * nb) || 1);
        const T = 0.42;
        const s = cos <= 0.18 ? 0 : cos < T ? (75 * (cos - 0.18)) / (T - 0.18) : 75 + (25 * (cos - T)) / (1 - T);
        return Math.max(0, Math.min(100, Math.round(s * 10) / 10));
      }

      /* ============================================================================
         ACTIVE AI LIVENESS AGENT & PRESENTATION ATTACK DETECTOR (PAD v2.0)
         Calibrated to prevent false-positive spoof blocks on real human faces
         under indoor lighting, webcam sharpening, or glasses, while actively
         catching phone screens, printed photos, and static replays.
      ============================================================================ */
      const spoofHistory = {
        prevLuma: null,
        prevW: 0,
        prevH: 0,
        prevCenterX: null,
        prevCenterY: null,
        kpsHistory: [],
        motionHistory: [],
        scoreHistory: [],
        warmupFrames: 0,
        challenge: {
          active: false,
          type: 'nod_or_turn',
          prompt: 'Turn head slightly left or right',
          startTime: 0,
          passed: false,
          initialNoseX: null,
          initialNoseY: null,
          maxDelta: 0
        }
      };

      function resetSpoofHistory() {
        spoofHistory.prevLuma = null;
        spoofHistory.prevCenterX = null;
        spoofHistory.prevCenterY = null;
        spoofHistory.kpsHistory = [];
        spoofHistory.motionHistory = [];
        spoofHistory.scoreHistory = [];
        spoofHistory.warmupFrames = 0;
        spoofHistory.challenge = {
          active: false,
          type: 'nod_or_turn',
          prompt: 'Slightly turn or nod your head to confirm 3D depth',
          startTime: 0,
          passed: false,
          initialNoseX: null,
          initialNoseY: null,
          maxDelta: 0
        };
      }

      function analyzeLiveness(canvas, faceBox, kps, strictMode, activeAgentEnabled = true) {
        const w = canvas.width;
        const h = canvas.height;
        if (!w || !h || !faceBox || faceBox.width < 40) {
          return {
            suspiciousScore: 0,
            authenticityScore: 100,
            isSuspicious: false,
            verdict: 'Awaiting Face',
            flags: [],
            agentDecision: 'IDLE',
            agentReason: 'Active AI Agent standing by for student face in frame.',
            challengePrompt: null,
            challengePassed: false,
            metrics: { moire: 0, glare: 0, motion: 85, depth: 85, skinTone: 90 }
          };
        }

        // Reset history if face jumped to a different person (e.g. nearest student changed)
        const curCenterX = (faceBox.x + faceBox.width / 2) / w;
        const curCenterY = (faceBox.y + faceBox.height / 2) / h;
        if (
          spoofHistory.prevCenterX !== null &&
          Math.hypot(curCenterX - spoofHistory.prevCenterX, curCenterY - spoofHistory.prevCenterY) > 0.22
        ) {
          resetSpoofHistory();
        }
        spoofHistory.prevCenterX = curCenterX;
        spoofHistory.prevCenterY = curCenterY;
        spoofHistory.warmupFrames += 1;

        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imgData = ctx.getImageData(0, 0, w, h).data;

        // Focus on inner face region (avoids hair/background edges causing false high-frequency noise)
        const insetX = Math.floor(faceBox.width * 0.14);
        const insetY = Math.floor(faceBox.height * 0.14);
        const fx = Math.max(2, Math.floor(faceBox.x + insetX));
        const fy = Math.max(2, Math.floor(faceBox.y + insetY));
        const fw = Math.min(w - fx - 2, Math.max(20, Math.floor(faceBox.width - insetX * 2)));
        const fh = Math.min(h - fy - 2, Math.max(20, Math.floor(faceBox.height - insetY * 2)));

        let highFreqEnergy = 0;
        let periodicGridHits = 0;
        let pixelCount = 0;
        let specularPixels = 0;
        let blueScreenPixels = 0;
        let naturalSkinPixels = 0;
        let satSum = 0;
        const currLuma = new Float32Array(32 * 32);

        for (let y = fy + 2; y < fy + fh - 2; y += 2) {
          for (let x = fx + 2; x < fx + fw - 2; x += 2) {
            const idx = (y * w + x) * 4;
            const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;

            const idxL = (y * w + (x - 1)) * 4;
            const idxR = (y * w + (x + 1)) * 4;
            const idxU = ((y - 1) * w + x) * 4;
            const idxD = ((y + 1) * w + x) * 4;

            const lumaL = 0.299 * imgData[idxL] + 0.587 * imgData[idxL + 1] + 0.114 * imgData[idxL + 2];
            const lumaR = 0.299 * imgData[idxR] + 0.587 * imgData[idxR + 1] + 0.114 * imgData[idxR + 2];
            const lumaU = 0.299 * imgData[idxU] + 0.587 * imgData[idxU + 1] + 0.114 * imgData[idxU + 2];
            const lumaD = 0.299 * imgData[idxD] + 0.587 * imgData[idxD + 1] + 0.114 * imgData[idxD + 2];

            const lap = Math.abs(4 * luma - lumaL - lumaR - lumaU - lumaD);
            highFreqEnergy += lap;

            // Detect alternating LCD/OLED subpixel checkerboard pattern (strong sign of phone screen)
            if ((luma > lumaL + 14 && luma > lumaR + 14) || (luma < lumaL - 14 && luma < lumaR - 14)) {
              periodicGridHits++;
            }

            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);

            // Clipped pure-white screen reflection
            if (luma > 246 && (maxC - minC) < 12) {
              specularPixels++;
            }

            // LCD backlight blue-channel spike (phones emit strong 450nm blue spike)
            if (b > r + 26 && b > g + 16 && luma > 105) {
              blueScreenPixels++;
            }

            // Natural human skin chrominance check (works across all skin tones in YCbCr/RGB)
            const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
            const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
            if (cr >= 131 && cr <= 178 && cb >= 76 && cb <= 128) {
              naturalSkinPixels++;
            }

            satSum += maxC > 0 ? (maxC - minC) / maxC : 0;
            pixelCount++;
          }
        }

        for (let gy = 0; gy < 32; gy++) {
          for (let gx = 0; gx < 32; gx++) {
            const sx = Math.min(w - 1, fx + Math.floor((gx / 32) * fw));
            const sy = Math.min(h - 1, fy + Math.floor((gy / 32) * fh));
            const idx = (sy * w + sx) * 4;
            currLuma[gy * 32 + gx] = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
          }
        }

        let frameDiff = 3.5;
        if (spoofHistory.prevLuma) {
          let diffSum = 0;
          for (let i = 0; i < 1024; i++) {
            diffSum += Math.abs(currLuma[i] - spoofHistory.prevLuma[i]);
          }
          frameDiff = diffSum / 1024;
        }
        spoofHistory.prevLuma = currLuma;
        spoofHistory.prevW = fw;
        spoofHistory.prevH = fh;
        spoofHistory.motionHistory.push(frameDiff);
        if (spoofHistory.motionHistory.length > 14) spoofHistory.motionHistory.shift();

        // 3D Facial Depth & Keypoint Parallax
        let parallaxScore = 76;
        let currentNoseX = 0;
        let currentNoseY = 0;
        if (kps && kps.length >= 3) {
          const eyeMidX = (kps[0][0] + kps[1][0]) / 2;
          const eyeMidY = (kps[0][1] + kps[1][1]) / 2;
          const eyeDist = Math.hypot(kps[1][0] - kps[0][0], kps[1][1] - kps[0][1]) || 1;
          currentNoseX = (kps[2][0] - eyeMidX) / eyeDist;
          currentNoseY = (kps[2][1] - eyeMidY) / eyeDist;
          spoofHistory.kpsHistory.push({ nx: currentNoseX, ny: currentNoseY, bx: faceBox.x / w, by: faceBox.y / h });
          if (spoofHistory.kpsHistory.length > 16) spoofHistory.kpsHistory.shift();

          if (spoofHistory.kpsHistory.length >= 5) {
            let boxMove = 0;
            let noseParallax = 0;
            for (let i = 1; i < spoofHistory.kpsHistory.length; i++) {
              const prev = spoofHistory.kpsHistory[i - 1];
              const curr = spoofHistory.kpsHistory[i];
              boxMove += Math.hypot(curr.bx - prev.bx, curr.by - prev.by);
              noseParallax += Math.hypot(curr.nx - prev.nx, curr.ny - prev.ny);
            }
            // Only penalize if face moved significantly across screen with ZERO 3D nose-to-eye shift
            if (boxMove > 0.035 && noseParallax < 0.0025) {
              parallaxScore = 24;
            } else if (noseParallax >= 0.004) {
              parallaxScore = 92;
            } else {
              parallaxScore = 76; // Natural steady posture
            }
          }
        }

        // Rectangular phone bezel border detector around face
        let borderSharpness = 0;
        const padX = Math.max(0, Math.floor(faceBox.x - faceBox.width * 0.25));
        const padY = Math.max(0, Math.floor(faceBox.y - faceBox.height * 0.25));
        const padR = Math.min(w - 2, Math.floor(faceBox.x + faceBox.width * 1.25));
        let borderSamples = 0;
        for (let x = padX; x < padR; x += 4) {
          const idx1 = (padY * w + x) * 4;
          const idx2 = ((padY + 2) * w + x) * 4;
          const l1 = 0.299 * imgData[idx1] + 0.587 * imgData[idx1 + 1] + 0.114 * imgData[idx1 + 2];
          const l2 = 0.299 * imgData[idx2] + 0.587 * imgData[idx2 + 1] + 0.114 * imgData[idx2 + 2];
          if (Math.abs(l1 - l2) > 72) borderSharpness++;
          borderSamples++;
        }
        const bezelRatio = borderSamples > 0 ? borderSharpness / borderSamples : 0;

        const avgLap = pixelCount > 0 ? highFreqEnergy / pixelCount : 0;
        const gridRatio = pixelCount > 0 ? periodicGridHits / pixelCount : 0;
        const glareRatio = pixelCount > 0 ? specularPixels / pixelCount : 0;
        const blueRatio = pixelCount > 0 ? blueScreenPixels / pixelCount : 0;
        const skinRatio = pixelCount > 0 ? naturalSkinPixels / pixelCount : 0.75;
        const avgSat = pixelCount > 0 ? satSum / pixelCount : 0.35;
        const avgMotion = spoofHistory.motionHistory.reduce((a, b) => a + b, 0) / spoofHistory.motionHistory.length;

        const moireRisk = Math.min(
          100,
          Math.max(0, Math.round(Math.max(0, avgLap - 24.5) * 3.1 + gridRatio * 240 + blueRatio * 140))
        );
        const glareRisk = Math.min(
          100,
          Math.max(0, Math.round(Math.max(0, glareRatio - 0.015) * 420 + Math.max(0, bezelRatio - 0.28) * 95))
        );
        const staticRisk =
          spoofHistory.motionHistory.length >= 8
            ? avgMotion < 0.42
              ? Math.min(95, Math.round((0.55 - avgMotion) * 140))
              : avgMotion > 42
              ? 55
              : 4
            : 4;
        const flatDepthRisk = Math.max(0, 100 - parallaxScore);
        const skinAuthenticity = Math.min(100, Math.max(10, Math.round(skinRatio * 125)));
        const colorCastRisk = skinRatio < 0.32 || avgSat < 0.07 || avgSat > 0.82 ? 42 : 4;

          staticRisk * 0.18 +
          flatDepthRisk * 0.16 +

        if (spoofHistory.scoreHistory.length > 6) spoofHistory.scoreHistory.shift();

        let agentReason = 'Natural skin chrominance, 3D facial geometry & organic micro-motion confirmed.';
        let challengePrompt = null;
        let challengePassed = spoofHistory.challenge.passed;

          }

            agentDecision = 'CHALLENGE_PASSED';
            agentReason = 'Active 3D Head-Parallax Challenge passed! Confirmed live human presence.';
          }
          // 3. Gray-zone / Borderline suspicion (38% - 76%): Instead of falsely blocking a real student,
          //    Active AI Agent issues a fast 3D head-movement challenge!
          else if (smoothedSuspicion >= 38 && smoothedSuspicion < 78) {
            if (!spoofHistory.challenge.active) {
              spoofHistory.challenge.active = true;
              spoofHistory.challenge.startTime = Date.now();

              spoofHistory.challenge.initialNoseY = currentNoseY;
              spoofHistory.challenge.maxDelta = 0;
            }
            const delta = Math.hypot(
              currentNoseX - (spoofHistory.challenge.initialNoseX ?? currentNoseX),
              currentNoseY - (spoofHistory.challenge.initialNoseY ?? currentNoseY)
            );
            if (delta > spoofHistory.challenge.maxDelta) {
              spoofHistory.challenge.maxDelta = delta;
            }
            if (spoofHistory.challenge.maxDelta >= 0.055) {
              spoofHistory.challenge.passed = true;
              spoofHistory.challenge.active = false;
              challengePassed = true;
              smoothedSuspicion = 12;
              agentDecision = 'CHALLENGE_PASSED';
              agentReason = '3D nose-to-eye parallax verified! Real student cleared by Active AI Agent.';
            } else {
              // Hold verification in "CHALLENGE_PENDING" without firing a false spoof alert
              smoothedSuspicion = Math.min(smoothedSuspicion, baseCutoff - 4);
              agentDecision = 'CHALLENGE_ACTIVE';
              challengePrompt = 'Active AI Check: Turn or nod your head slightly to verify live 3D presence';
              agentReason = `Borderline lighting/glare (${rawSuspicion}%). Requesting slight 3D head turn (${Math.min(100, Math.round((spoofHistory.challenge.maxDelta / 0.055) * 100))}% done).`;
            }
          } else if (smoothedSuspicion >= 78) {
            agentDecision = 'SPOOF_BLOCKED';
            agentReason = 'High-confidence 2D screen/photo signature (Moiré grid + flat plane + blue backlight).';
          }
        }

        const isSuspicious =
          agentDecision === 'CHALLENGE_ACTIVE' || agentDecision === 'CALIBRATING'
            ? false
            : smoothedSuspicion >= baseCutoff;

        const flags = [];
        if (moireRisk >= 52) flags.push('Screen Pixel / Moire Grid');
        if (glareRisk >= 50) flags.push('Display Glare / Bezel Edge');
        if (staticRisk >= 55) flags.push(avgMotion < 0.42 ? 'Frozen / Static Photo Frame' : 'Unnatural Video Replay Jitter');
        if (flatDepthRisk >= 68) flags.push('Flat 2D Plane (Zero 3D Parallax)');
        if (colorCastRisk >= 35) flags.push('Non-Skin Display Color Spectrum');

        return {
          suspiciousScore: Math.min(99, Math.max(2, smoothedSuspicion)),
          authenticityScore: Math.max(1, Math.min(98, 100 - smoothedSuspicion)),
          isSuspicious,
          verdict:
            agentDecision === 'CHALLENGE_ACTIVE'
              ? '3D LIVENESS CHECK'
              : isSuspicious

          flags,
          agentDecision,
          agentReason,

        ts: 0,

      function setTargetSelectionMode(mode) {

      }

      function pollLiveFrame(canvas) {
        const none = {
          x: 0,
          y: 0,
          width: 0,
          height: 0,
          detected: false,
          fresh: false,
          kps: null,
          totalFaces: 0,
          allFaces: []
        };
        if (!modelsReady || !canvas || !canvas.width) return none;
        if (!liveState.busy) {
          liveState.busy = true;
          const k = Math.min(1, 480 / canvas.width);
          if (!liveState.snap) liveState.snap = document.createElement('canvas');
          liveState.snap.width = Math.max(1, Math.round(canvas.width * k));
          liveState.snap.height = Math.max(1, Math.round(canvas.height * k));

          enqueue(async () => {
            const fs = await detectRaw(liveState.snap, 1, 0.6);
            const validFs = fs.filter((q) => q.w / k >= 42);
            const f = validFs.length
              ? bestFace(validFs, liveState.targetMode, liveState.snap.width, liveState.snap.height)
              : null;

            // Sort faces by proximity (area descending) so rank #1 is always nearest student
            const sortedByProximity = [...validFs].sort((a, b) => b.w * b.h - a.w * a.h);
            const all = sortedByProximity.map((q, idx) => ({
              x: q.x / k,
              y: q.y / k,
              w: q.w / k,
              h: q.h / k,
              area: Math.round((q.w / k) * (q.h / k)),
              proximityRank: idx + 1,
              score: q.score,
              primary: q === f,
              kps: q.kps.map((p) => [(p[0] - q.x) / q.w, (p[1] - q.y) / q.h])
            }));

            if (!f) return { all, best: null };
            return {
              all,
              best: {
                box: { x: f.x / k, y: f.y / k, width: f.w / k, height: f.h / k },
                kps: f.kps.map((p) => [p[0] / k, p[1] / k]),
                descriptor: await embedFace(liveState.snap, f)
              }
            };
          })
            .then((o) => {
              liveState.faces = o.all;
              liveState.seq++;
              if (o.best && o.best.box.width >= 50) {
                liveState.res = o.best;
                liveState.fresh = true;
              } else {
                liveState.res = null;
              }
              liveState.ts = Date.now();
            })
            .catch(() => {
              liveState.res = null;
              liveState.faces = [];
              liveState.seq++;
            })
            .then(() => {
              liveState.busy = false;
            });
        }
        if (liveState.res && Date.now() - liveState.ts < 1500) {
          const b = liveState.res.box;
          const out = {
            x: b.x,
            y: b.y,
            width: b.width,
            height: b.height,
            detected: true,
            fresh: liveState.fresh,
            desc: liveState.res.descriptor,
            kps: liveState.res.kps,
            totalFaces: liveState.faces.length,
            allFaces: liveState.faces
          };
          liveState.fresh = false;
          return out;
        }
        return none;
      }

      /* ---- Camera & Image Helpers ---- */
      async function openCamera(w, h) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera API unavailable in this browser. Open via HTTPS or localhost.');
        }
        const constraints = [
          { video: { facingMode: 'user', width: { ideal: w || 640 }, height: { ideal: h || 480 } }, audio: false },
          { video: { facingMode: 'user' }, audio: false },
          { video: true, audio: false }
        ];
        let lastErr;
        for (let i = 0; i < constraints.length; i++) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints[i]);
            try {
              const track = stream.getVideoTracks()[0];
              if (track && track.getCapabilities) {
                const caps = track.getCapabilities();
                const advanced = {};
                if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.exposureMode = 'continuous';
                if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.whiteBalanceMode = 'continuous';
                if (caps.brightness && typeof caps.brightness.max === 'number') {
                  advanced.brightness = Math.min(caps.brightness.max, (caps.brightness.min + caps.brightness.max) * 0.65);
                }
                if (caps.exposureCompensation && typeof caps.exposureCompensation.max === 'number') {
                  advanced.exposureCompensation = Math.min(caps.exposureCompensation.max, caps.exposureCompensation.max * 0.55);
                }
                if (Object.keys(advanced).length > 0) {
                  await track.applyConstraints({ advanced: [advanced] });
                }
              }
            } catch (capErr) {}
            return stream;
          } catch (e) {
            lastErr = e;
            if (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')) {
              throw new Error('Camera permission denied. Allow camera access in your browser settings.');
            }
          }
        }
        throw new Error((lastErr && lastErr.message) || 'Could not access webcam.');
      }

      function attachStream(videoEl, stream) {
        if (!videoEl) return;
        videoEl.muted = true;
        videoEl.playsInline = true;
        videoEl.srcObject = stream;
        const p = videoEl.play();
        if (p && p.catch) p.catch(() => {});
      }

      function fileToCanvas(file, maxDim) {
        maxDim = maxDim || 480;
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            const w = img.naturalWidth, h = img.naturalHeight;
            const k = Math.min(1, maxDim / Math.max(w, h));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(w * k));
            c.height = Math.max(1, Math.round(h * k));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            autoEnhanceFrame(c);
            URL.revokeObjectURL(url);
            resolve(c);
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Invalid image')); };
          img.src = url;
        });
      }

      window.FG = {
        live: liveState,
        ready,
        openCamera,
        attachStream,
        fileToCanvas,
        autoEnhanceFrame,
        describeCanvas,
        describeImage,
        similarity,
        pollLiveFrame,
        setTargetSelectionMode,
        analyzeLiveness,
        resetSpoofHistory
      };
    })();
  </script>

    function calcDistanceMeters(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * 6371000 * Math.asin(Math.sqrt(a));
    }

    function parseMinutes(hhmm) {

    function isWithinSchedule(config, now) {
      const day = now.getDay();
      const prevDay = (day + 6) % 7;
      const mins = now.getHours() * 60 + now.getMinutes();
      return (config.windows || []).some((w) => {
        const s = parseMinutes(w.start);
        const e = parseMinutes(w.end);

    /* ---- Web Audio Feedback Chimes ---- */
    function playChime(type) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.36);
        } else if (type === 'spoof') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(165, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {}
    }

    /* ---- Helper: Capture Live Snapshot Frame from Video/Canvas ---- */
    function captureStudentSnapshot(sourceCanvas, isSpoof = false) {
      const out = document.createElement('canvas');
      out.width = isSpoof ? 320 : 400;
      out.height = isSpoof ? 240 : 300;
      const ctx = out.getContext('2d');
      ctx.save();
      if (!isSpoof) {
        ctx.translate(out.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(sourceCanvas, 0, 0, out.width, out.height);
      ctx.restore();

      ctx.fillStyle = isSpoof ? 'rgba(136, 19, 55, 0.88)' : 'rgba(2, 6, 23, 0.72)';
      ctx.fillRect(0, out.height - 26, out.width, 26);
      ctx.fillStyle = isSpoof ? '#fda4af' : '#34d399';
      ctx.font = '600 11px "JetBrains Mono", monospace';
      ctx.fillText(
        (isSpoof ? 'SPOOF BLOCKED CAPTURE • ' : 'VERIFIED LIVE CAPTURE • ') + new Date().toLocaleString(),
        10,
        out.height - 9
      );

      return out.toDataURL('image/jpeg', isSpoof ? 0.6 : 0.85);
    }

    function App() {
      const [activeTab, setActiveTab] = useState('scanner');
      const [isAdmin, setIsAdmin] = useState(false);

      const [toast, setToast] = useState(null);

      const [repository, setRepository] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(REPO_KEY) || 'null');
          if (Array.isArray(saved) && saved.length > 0) {
            const existingIds = new Set(saved.map((s) => String(s.id).toLowerCase()));
            const missingDefaults = DEFAULT_STUDENTS.filter(
              (d) => !existingIds.has(String(d.id).toLowerCase())
            );
            return [...saved, ...missingDefaults];
          }
        } catch (e) {}
        return DEFAULT_STUDENTS;
      });

      const [attendanceLogs, setAttendanceLogs] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(LOGS_KEY) || 'null');
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

      const [capturesDb, setCapturesDb] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(CAPTURES_DB_KEY) || 'null');
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

        try {

          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

      const [aiSettings, setAiSettings] = useState(() => {
        const defaults = {
          antiSpoofEnabled: true,
          activeAgentEnabled: true,
          nearestOnlyMode: true,
          strictMode: false,
          autoCaptureOnVerify: true
        };
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');

        } catch (e) {

        }
      });

      const [geofence, setGeofence] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(GEOFENCE_KEY) || 'null');
          return saved ? { ...DEFAULT_GEOFENCE, ...saved } : DEFAULT_GEOFENCE;
        } catch (e) {
          return DEFAULT_GEOFENCE;
        }
      });

      const [periods, setPeriods] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(PERIODS_KEY) || 'null');
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

      const [periodMarked, setPeriodMarked] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(PERIOD_MARKED_KEY) || 'null');
          return saved && typeof saved === 'object' ? saved : {};
        } catch (e) {
          return {};

      });

      const [periodSpoofBlocked, setPeriodSpoofBlocked] = useState(() => {

          const saved = JSON.parse(localStorage.getItem(PERIOD_SPOOF_BLOCKED_KEY) || 'null');
          return saved && typeof saved === 'object' ? saved : {};
        } catch (e) {
          return {};
        }
      });

      const [coords, setCoords] = useState(null);
      const [geoErr, setGeoErr] = useState(null);
      const [nowClock, setNowClock] = useState(() => new Date());

      useEffect(() => {
        const timer = setInterval(() => setNowClock(new Date()), 5000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!geofence.enabled) {
          setCoords(null);
          setGeoErr(null);
          return;
        }
        if (!('geolocation' in navigator)) {
          setGeoErr('unsupported');
          return;
        }
        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            setGeoErr(null);
            setCoords({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            });
          },
          (err) => setGeoErr(err.code === 1 ? 'denied' : 'unavailable'),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
        );
        return () => navigator.geolocation.clearWatch(watchId);
      }, [geofence.enabled]);

      const geoAccess = evaluateGeofenceAccess(geofence, coords, geoErr, nowClock);
      const activePeriod = getActiveAttendancePeriod(periods, nowClock);

      useEffect(() => {
        const html = document.documentElement;
        if (theme === 'dark') html.classList.add('dark');
        else html.classList.remove('dark');
      }, [theme]);

      useEffect(() => {
        let active = true;
        window.FG.ready.then(async () => {
          const updated = await Promise.all(
            repository.map(async (item) => {
              if (item.embedding && item.embedding.length === 128) return item;
              try {
                const res = await window.FG.describeImage(item.photoUrl);
                return { ...item, embedding: res.descriptor };
              } catch (e) {
                return item;
              }
            })
          );
          if (active) setRepository(updated);
        });
        return () => { active = false; };
      }, []);

      useEffect(() => {
        try { localStorage.setItem(REPO_KEY, JSON.stringify(repository)); } catch (e) {}
      }, [repository]);

      useEffect(() => {
        try { localStorage.setItem(LOGS_KEY, JSON.stringify(attendanceLogs)); } catch (e) {}
      }, [attendanceLogs]);

      useEffect(() => {
        safePersist(CAPTURES_DB_KEY, capturesDb, 'capturedPhotoUrl');
      }, [capturesDb]);

      useEffect(() => {
        if (!safePersist(SPOOF_ALERTS_KEY, spoofAlerts, 'snapshotUrl')) {
          console.warn('FaceGuard: spoof alerts could not be persisted (storage full).');
        }
      }, [spoofAlerts]);

      useEffect(() => {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(aiSettings)); } catch (e) {}
      }, [aiSettings]);

      useEffect(() => {
        try { localStorage.setItem(GEOFENCE_KEY, JSON.stringify(geofence)); } catch (e) {}
      }, [geofence]);

      useEffect(() => {
        try { localStorage.setItem(PERIODS_KEY, JSON.stringify(periods)); } catch (e) {}
      }, [periods]);

      useEffect(() => {
        try { localStorage.setItem(PERIOD_MARKED_KEY, JSON.stringify(periodMarked)); } catch (e) {}
      }, [periodMarked]);

      useEffect(() => {
        try { localStorage.setItem(PERIOD_SPOOF_BLOCKED_KEY, JSON.stringify(periodSpoofBlocked)); } catch (e) {}
      }, [periodSpoofBlocked]);

      const repositoryRef = useRef(repository);
      repositoryRef.current = repository;
      const [refreshTick, setRefreshTick] = useState(0);
      const [refreshing, setRefreshing] = useState(false);
      const cfgSyncRef = useRef({});
      const cfgReadyRef = useRef(false);
      const cfgStateRef = useRef({});
      cfgStateRef.current = { geofence, periods, aiSettings };
      const localDataRef = useRef({});
      localDataRef.current = { attendanceLogs, capturesDb, spoofAlerts };

      // Config me local badlav hote hi cloud me bhejo
      useEffect(() => {
        const FG = window.FGCloud;
        if (!FG || !FG.enabled || !cfgReadyRef.current) return;
        [['geofence', geofence], ['periods', periods], ['aiSettings', aiSettings]].forEach(([name, val]) => {
          const json = stableJson(val);
          if (json !== cfgSyncRef.current[name]) {
            cfgSyncRef.current[name] = json;
            FG.save('config', name, { id: name, value: val, timestamp: new Date().toISOString() });
          }
        });
      }, [geofence, periods, aiSettings]);

      /* ---- Firebase cloud sync: sab devices ka data merge hota hai ---- */
      const [cloudStatus, setCloudStatus] = useState(window.FGCloud ? window.FGCloud.status : 'off');
      useEffect(() => {
        const FG = window.FGCloud;
        if (!FG || !FG.enabled) return;
        const offStatus = FG.onStatus(setCloudStatus);
        const mergeInto = (setter, idKey, cap) => (docs, removed) =>
          setter((prev) => {
            const map = new Map(prev.filter((x) => !removed.includes(x[idKey])).map((x) => [x[idKey], x]));
            docs.forEach((d) => map.set(d[idKey], { ...(map.get(d[idKey]) || {}), ...d }));
            return [...map.values()]
              .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
              .slice(0, cap);
          });
        // Purani (sync se pehle ki) aaj ki entries ko ek baar cloud me upload karo
        const backfilled = {};
        const withBackfill = (col, idKey, setter, cap) => {
          const merge = mergeInto(setter, idKey, cap);
          return (docs, removed, fromCache) => {
            if (!fromCache && !backfilled[col]) {
              backfilled[col] = true;
              const cloudIds = new Set(docs.map((d) => String(d[idKey])));
              const today = new Date().toDateString();
              (localDataRef.current[col] || []).forEach((it) => {
                if (
                  it && it.timestamp && !cloudIds.has(String(it[idKey])) &&
                  new Date(it.timestamp).toDateString() === today
                ) {
                  FG.save(col, it[idKey], it);
                }
              });
            }
            merge(docs, removed);
          };
        };
        const u1 = FG.subscribe('spoofAlerts', withBackfill('spoofAlerts', 'id', setSpoofAlerts, 100), 100);
        const u2 = FG.subscribe('capturesDb', withBackfill('capturesDb', 'captureId', setCapturesDb, 200), 200);
        const u3 = FG.subscribe('attendanceLogs', withBackfill('attendanceLogs', 'id', setAttendanceLogs, 150), 150);
        // Students (repository): cloud se merge + pehli baar local naye students upload
        let firstRepo = true;
        const u4 = FG.subscribe('students', (docs, removed, fromCache) => {
          setRepository((prev) => {
            const cloud = new Map(docs.map((d) => [sid(d.id), d]));
            const kept = prev
              .filter((st) => !removed.includes(sid(st.id)))
              .map((st) => (cloud.has(sid(st.id)) ? { ...st, ...cloud.get(sid(st.id)) } : st));
            const have = new Set(kept.map((st) => sid(st.id)));
            const fresh = docs.filter((d) => !have.has(sid(d.id)));
            return [...fresh, ...kept];
          });
          if (firstRepo && !fromCache) {
            firstRepo = false;
            const cloudIds = new Set(docs.map((d) => sid(d.id)));
            const defaultIds = new Set(DEFAULT_STUDENTS.map((d) => sid(d.id)));
            repositoryRef.current.forEach((st) => {
              if (!cloudIds.has(sid(st.id)) && !defaultIds.has(sid(st.id))) {
                FG.save('students', sid(st.id), { ...st, timestamp: st.timestamp || new Date().toISOString() });
              }
            });
          }
        }, 500);
        // Period marks / spoof blocks (har key ek doc; reset par delete)
        const keyMerge = (setter) => (docs, removed) =>
          setter((prev) => {
            const next = { ...prev };
            removed.forEach((rid) => { try { delete next[decodeURIComponent(rid)]; } catch (e) {} });
            docs.forEach((d) => { if (d.key) next[d.key] = true; });
            return next;
          });
        const u5 = FG.subscribe('periodMarks', keyMerge(setPeriodMarked), 500);
        const u6 = FG.subscribe('periodBlocks', keyMerge(setPeriodSpoofBlocked), 500);

        // Config: geofence, periods, aiSettings
        const specs = {
          geofence: (v) => setGeofence(v),
          periods: (v) => setPeriods(v),
          aiSettings: (v) => setAiSettings((prev) => ({ ...prev, ...v }))
        };
        const u7 = FG.subscribe('config', (docs, removed, fromCache) => {
          const byId = new Map(docs.map((d) => [d.id, d]));
          Object.keys(specs).forEach((name) => {
            const d = byId.get(name);
            if (d && d.value !== undefined) {
              const json = stableJson(d.value);
              if (json !== cfgSyncRef.current[name]) {
                cfgSyncRef.current[name] = json;
                specs[name](d.value);
              }
            } else if (!fromCache && cfgSyncRef.current[name] === undefined) {
              const local = cfgStateRef.current[name];
              cfgSyncRef.current[name] = stableJson(local);
              FG.save('config', name, { id: name, value: local, timestamp: new Date().toISOString() });
            }
          });
          if (!fromCache) cfgReadyRef.current = true;
        }, 20);
        return () => { offStatus(); u1(); u2(); u3(); u4(); u5(); u6(); u7(); };
      }, [refreshTick]);

      const showNotice = useCallback((msg, tone = 'info') => {
        setToast({ msg, tone });
        setTimeout(() => setToast(null), 5000);
      }, []);

      const checkPeriodEligibility = useCallback(
        (person) => {
          if (!geoAccess.allowed) {
            return { ok: false, reason: geoAccess.reason };
          }
          const currentPer = getActiveAttendancePeriod(periods, new Date());
          if (currentPer === 'none') {
            return { ok: false, reason: 'No attendance period is active right now.' };
          }
          if (currentPer && periodSpoofBlocked[`${person.id}|${currentPer.key}`]) {
            return {
              ok: false,
              reason: `${person.name} (${person.id}) is BLOCKED for "${currentPer.name}" due to an AI spoof alert!`
            };
          }
          if (currentPer && periodMarked[`${person.id}|${currentPer.key}`]) {
            return {
              ok: false,
              reason: `${person.name} is already marked present for "${currentPer.name}" (1 check-in per period).`
            };
          }
          return { ok: true, period: currentPer };
        },
        [geoAccess, periods, periodMarked, periodSpoofBlocked]
      );

      const handleVerifiedAttendance = useCallback((record) => {
        const currentPer = getActiveAttendancePeriod(periods, new Date());
        if (currentPer === 'none') return;

        const periodName = currentPer ? currentPer.name : null;
        const periodKey = currentPer ? currentPer.key : null;

        if (periodKey && periodSpoofBlocked[`${record.personId}|${periodKey}`]) {
          showNotice(
            `BLOCKED: ${record.personName} is locked out of "${periodName}" due to a spoof attempt.`,
            'danger'
          );
          return;
        }

        if (periodKey) {
          if (window.FGCloud) window.FGCloud.save('periodMarks', sid(`${record.personId}|${periodKey}`), { key: `${record.personId}|${periodKey}`, timestamp: new Date().toISOString() });
          setPeriodMarked((prev) => ({ ...prev, [`${record.personId}|${periodKey}`]: true }));
        }

        const enrichedRecord = {
          ...record,
          periodName,
          periodKey
        };

        if (window.FGCloud) window.FGCloud.save('attendanceLogs', enrichedRecord.id, enrichedRecord);
        setAttendanceLogs((prev) => [enrichedRecord, ...prev.slice(0, 149)]);
        if (record.capturedPhotoUrl) {
          const dbEntry = {
            captureId: 'CAP-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
            studentId: record.personId,
            studentName: record.personName,
            department: record.department,
            timestamp: record.timestamp,
            confidence: record.confidence,
            livenessScore: record.livenessScore,
            suspiciousScore: record.suspiciousScore,
            periodName,
            capturedPhotoUrl: record.capturedPhotoUrl,
            referencePhotoUrl: record.referencePhotoUrl,
            deviceLabel: 'Terminal 1 · Live AI Camera'
          };
          if (window.FGCloud) window.FGCloud.save('capturesDb', dbEntry.captureId, dbEntry);
          setCapturesDb((prev) => [dbEntry, ...prev.slice(0, 199)]);
        }
        showNotice(
          `Verified & Captured: ${record.personName}${periodName ? ` (${periodName})` : ''} — Liveness ${record.livenessScore}%`,
          'success'
        );
      }, [periods, periodSpoofBlocked, showNotice]);

      const handleSpoofDetected = useCallback((alertItem, targetPerson = null) => {
        const currentPer = getActiveAttendancePeriod(periods, new Date());
        const periodName = currentPer && currentPer !== 'none' ? currentPer.name : null;
        const periodKey = currentPer && currentPer !== 'none' ? currentPer.key : null;

        const targetId = alertItem.targetStudentId || (targetPerson && targetPerson.id) || null;
        if (periodKey && targetId) {
          if (window.FGCloud) window.FGCloud.save('periodBlocks', sid(`${targetId}|${periodKey}`), { key: `${targetId}|${periodKey}`, timestamp: new Date().toISOString() });
          setPeriodSpoofBlocked((prev) => ({ ...prev, [`${targetId}|${periodKey}`]: true }));
        }

        const enrichedAlert = {
          ...alertItem,
          flags: Array.isArray(alertItem.flags) ? alertItem.flags : [],
          targetStudentId: targetId,
          studentName: (targetPerson && targetPerson.name) || null,
          periodName,
          periodKey
        };

        if (window.FGCloud) window.FGCloud.save('spoofAlerts', enrichedAlert.id, enrichedAlert);
        setSpoofAlerts((prev) => {
          if (prev.some((a) => a.id === enrichedAlert.id)) return prev;
          return [enrichedAlert, ...prev.slice(0, 99)];
        });
        showNotice(
          `SPOOF BLOCKED: ${alertItem.suspectedTarget} (${alertItem.suspiciousScore}% risk)${
            periodName && targetId ? ` — Blocked for ${periodName}` : ''
          } & logged in AI Spoof Alerts!`,
          'danger'
        );
      }, [periods, showNotice]);

      // Soft refresh: login/logout ya page reload ke bina cloud se latest data dobara laao
      const handleRefresh = () => {
        if (refreshing) return;
        setRefreshing(true);
        if (window.FGCloud && window.FGCloud.enabled) {
          setRefreshTick((t) => t + 1);
          showNotice('Latest data refreshed from the cloud.', 'success');
        } else {
          showNotice('Cloud sync is off. Data is stored on this device only.', 'info');
        }
        setTimeout(() => setRefreshing(false), 1200);
      };

      const navTabs = [
        { id: 'scanner', label: 'Live AI Scanner', icon: IconCamera, public: true },
        { id: 'captures_db', label: `Attendance Captures DB (${capturesDb.length})`, icon: IconDatabase, public: false },
        { id: 'students', label: `Students (${repository.length})`, icon: IconUsers, public: false },
        { id: 'geofence', label: 'Geofence & Periods', icon: IconPin, public: false },
        { id: 'security', label: `AI Spoof Alerts (${spoofAlerts.length})`, icon: IconAlert, public: false }
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/90 dark:bg-[#091226]/95 backdrop-blur-md border-b border-slate-200 dark:border-[#1A284C]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl brand-gradient flex items-center justify-center text-white shadow-md">
                  <IconShield className="w-5 h-5" />
                </div>
                <div>
                  <span className="font-extrabold text-lg tracking-tight text-slate-900 dark:text-white">
                    FaceGuard <span className="brand-gradient-text">AI</span>
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-600 dark:text-cyan-300 border border-cyan-500/30">
                    Anti-Spoof &amp; Capture DB
                  </span>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-2">
                {navTabs
                  .filter((t) => t.public || isAdmin)
                  .map((tab) => {
                    const Icon = tab.icon;
                    const active = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer ${
                          active
                            ? 'brand-gradient text-white shadow-sm'
                            : 'text-slate-600 dark:text-sky-200/80 hover:bg-slate-100 dark:hover:bg-[#0E1E42]'
                        }`}
                      >
                        <Icon className="w-4 h-4" />
                        <span>{tab.label}</span>
                      </button>
                    );
                  })}
              </nav>

              <div className="flex items-center gap-2.5">
                <span
                  className={`text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${
                    isAdmin
                      ? 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border border-amber-500/40'
                      : 'bg-cyan-500/15 text-cyan-700 dark:text-cyan-300 border border-cyan-500/30'
                  }`}
                >
                  {isAdmin ? 'Admin Mode' : 'Student Kiosk'}
                </span>

                <button
                  onClick={handleRefresh}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-[#1E3A8A] text-xs font-semibold bg-slate-50 dark:bg-[#0D1836] hover:bg-slate-100 dark:hover:bg-[#12224A] cursor-pointer flex items-center gap-1.5"
                  title="Refresh data (logout kiye bina)"
                >
                  <span className={refreshing ? 'inline-block animate-spin' : 'inline-block'}>⟳</span>
                  <span className="hidden sm:inline">Refresh</span>
                </button>

                <button
                  onClick={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-[#1E3A8A] text-xs font-medium bg-slate-50 dark:bg-[#0D1836] hover:bg-slate-100 dark:hover:bg-[#12224A] cursor-pointer"
                  title="Toggle Light/Dark Mode"
                >
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>

                {isAdmin ? (
                  <button
                    onClick={() => {
                      setIsAdmin(false);
                      setActiveTab('scanner');
                    }}
                    className="px-3 py-1.5 rounded-lg border border-rose-500/40 bg-rose-500/10 text-rose-600 dark:text-rose-300 text-xs font-semibold hover:bg-rose-500/20 cursor-pointer"
                  >
                    Logout Admin
                  </button>
                ) : (
                  <button
                    onClick={() => setActiveTab('admin_login')}
                    className="brand-gradient text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow hover:opacity-95 cursor-pointer flex items-center gap-1.5"
                  >
                    <IconLock className="w-3.5 h-3.5" />
                    <span>Admin Login</span>
                  </button>
                )}
              </div>
            </div>

            {/* Mobile Tab Strip */}
            <div className="flex lg:hidden items-center gap-1.5 px-4 py-2 border-t border-slate-200 dark:border-[#1A284C] overflow-x-auto">
              {navTabs
                .filter((t) => t.public || isAdmin)
                .map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap cursor-pointer ${
                      activeTab === tab.id
                        ? 'brand-gradient text-white'
                        : 'bg-slate-100 dark:bg-[#0D1836] text-slate-600 dark:text-sky-200'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4">
              <div
                className={`p-3.5 rounded-xl border text-xs font-semibold flex items-center justify-between shadow-sm ${
                  toast.tone === 'success'
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-700 dark:text-emerald-300'
                    : toast.tone === 'danger'
                    ? 'bg-rose-500/15 border-rose-500/40 text-rose-700 dark:text-rose-300'
                    : 'bg-cyan-500/15 border-cyan-500/40 text-cyan-800 dark:text-cyan-200'
                }`}
              >
                <span>{toast.msg}</span>
                <button onClick={() => setToast(null)} className="ml-4 opacity-70 hover:opacity-100 cursor-pointer">✕</button>
              </div>
            </div>
          )}

          {/* Main View Router */}
          <main className="flex-1">
            {activeTab === 'scanner' && (
              <LiveScannerView
                repository={repository}
                aiSettings={aiSettings}
                onUpdateSettings={setAiSettings}
                geoAccess={geoAccess}
                geofence={geofence}
                activePeriod={activePeriod}
                periods={periods}
                checkPeriodEligibility={checkPeriodEligibility}
                onNotice={showNotice}
                attendanceLogs={attendanceLogs}
                isAdmin={isAdmin}
                onVerifiedAttendance={handleVerifiedAttendance}
                onSpoofDetected={handleSpoofDetected}
                onOpenCaptureDb={() => setActiveTab(isAdmin ? 'captures_db' : 'admin_login')}
              />
            )}

            {activeTab === 'admin_login' && !isAdmin && (
              <AdminLoginView
                title="Admin Database & Security Login"
                subtitle="Enter the admin password to view captured attendance photos, manage student enrollment, or delete database records."
                onSuccess={() => {
                  setIsAdmin(true);
                  setActiveTab('captures_db');
                  showNotice('Admin session unlocked.', 'success');
                }}
              />
            )}

            {activeTab === 'captures_db' && (
              isAdmin ? (
                <AdminCaptureDatabaseView
                  capturesDb={capturesDb}
                  onDeleteCapture={(captureId) => {
                    if (window.FGCloud) window.FGCloud.remove('capturesDb', [captureId]);
                    setCapturesDb((prev) => prev.filter((item) => item.captureId !== captureId));
                    showNotice('Captured photo deleted from database.', 'info');
                  }}
                  onDeleteSelected={(idsSet) => {
                    if (window.FGCloud) window.FGCloud.remove('capturesDb', [...idsSet]);
                    setCapturesDb((prev) => prev.filter((item) => !idsSet.has(item.captureId)));
                    showNotice(`Deleted ${idsSet.size} selected photo record(s).`, 'info');
                  }}
                  onClearAllCaptures={() => {
                    if (window.FGCloud) window.FGCloud.remove('capturesDb', capturesDb.map((c) => c.captureId));
                    setCapturesDb([]);
                    showNotice('All captured attendance photos cleared from database.', 'info');
                  }}
                />
              ) : (
                <AdminLoginView
                  title="Captured Photos Database Locked"
                  subtitle="Only administrators can inspect or delete verified attendance snapshots."
                  onSuccess={() => setIsAdmin(true)}
                />
              )
            )}

            {activeTab === 'students' && (
              isAdmin ? (
                <StudentEnrollmentView
                  repository={repository}
                  onAddStudent={(stu) => {
                    if (window.FGCloud) window.FGCloud.save('students', sid(stu.id), { ...stu, timestamp: new Date().toISOString() });
                    setRepository((prev) => [stu, ...prev]);
                    showNotice(`Enrolled ${stu.name} (${stu.id}) into biometric repository.`, 'success');
                  }}
                  onImportBulk={(importedList) => {
                    if (window.FGCloud) {
                      const have = new Set(repository.map((x) => String(x.id).toLowerCase()));
                      importedList
                        .filter((x) => !have.has(String(x.id).toLowerCase()))
                        .forEach((x) => window.FGCloud.save('students', sid(x.id), { ...x, timestamp: new Date().toISOString() }));
                    }
                    setRepository((prev) => {
                      const existingIds = new Set(prev.map((s) => String(s.id).toLowerCase()));
                      const fresh = importedList.filter((s) => !existingIds.has(String(s.id).toLowerCase()));
                      return [...fresh, ...prev];
                    });
                    showNotice(`Imported ${importedList.length} profile(s) into repository.`, 'success');
                  }}
                  onUpdateStudent={(oldId, updatedFields) => {
                    if (window.FGCloud) {
                      const merged = { ...(repository.find((x) => x.id === oldId) || {}), ...updatedFields };
                      if (String(merged.id) !== String(oldId)) window.FGCloud.remove('students', [sid(oldId)]);
                      window.FGCloud.save('students', sid(merged.id), { ...merged, timestamp: new Date().toISOString() });
                    }
                    setRepository((prev) =>
                      prev.map((s) => (s.id === oldId ? { ...s, ...updatedFields } : s))
                    );
                    showNotice(`Updated profile for ${updatedFields.name}.`, 'success');
                  }}
                  onDeleteStudent={(id) => {
                    if (window.FGCloud) window.FGCloud.remove('students', [sid(id)]);
                    setRepository((prev) => prev.filter((s) => s.id !== id));
                    showNotice('Profile removed from repository.', 'info');
                  }}
                />
              ) : (
                <AdminLoginView
                  title="Admin Access Required"
                  subtitle="Enrolling students is restricted to administrators only."
                  onSuccess={() => setIsAdmin(true)}
                />
              )
            )}

            {activeTab === 'geofence' && (
              isAdmin ? (
                <AdminGeofencePeriodsView
                  geofence={geofence}
                  onUpdateGeofence={setGeofence}
                  geoAccess={geoAccess}
                  periods={periods}
                  onUpdatePeriods={setPeriods}
                  onResetPeriodMarks={() => {
                    if (window.FGCloud) {
                      window.FGCloud.remove('periodMarks', Object.keys(periodMarked).map(sid));
                      window.FGCloud.remove('periodBlocks', Object.keys(periodSpoofBlocked).map(sid));
                    }
                    setPeriodMarked({});
                    setPeriodSpoofBlocked({});
                    showNotice('All attendance & spoof period locks reset.', 'info');
                  }}
                />
              ) : (
                <AdminLoginView
                  title="Geofence & Period Settings Locked"
                  subtitle="Sign in as Admin to configure campus GPS boundaries and attendance periods."
                  onSuccess={() => setIsAdmin(true)}
                />
              )
            )}

            {activeTab === 'security' && (
              isAdmin ? (
                <AdminSecurityView
                  aiSettings={aiSettings}
                  onUpdateSettings={setAiSettings}
                  spoofAlerts={spoofAlerts}
                  onClearSpoofAlerts={() => {
                    if (window.FGCloud) window.FGCloud.remove('spoofAlerts', spoofAlerts.map((a) => a.id));
                    setSpoofAlerts([]);
                  }}
                />
              ) : (
                <AdminLoginView
                  title="AI Anti-Spoof Logs Locked"
                  subtitle="Sign in as Admin to review suspicious mobile photo/video spoofing attempts."
                  onSuccess={() => setIsAdmin(true)}
                />
              )
            )}
          </main>

          <footer className="border-t border-slate-200 dark:border-[#172548] bg-white dark:bg-[#070E22] py-5 text-xs text-slate-500 dark:text-sky-300/60">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>FaceGuard AI · Real-Time Liveness Anti-Spoofing &amp; Attendance Capture Database · Cloud: {cloudStatus === 'online' ? 'Firebase Synced' : cloudStatus === 'error' ? 'Firebase Error (local only)' : cloudStatus === 'connecting' ? 'Connecting…' : 'Off (local only)'}</span>
              <span className="font-semibold text-slate-700 dark:text-sky-200">
                Created by Rishi Jain, Sahil Verma, and Shubh Jain
              </span>
            </div>
          </footer>
        </div>
      );
    }

    /* ============================================================================
       VIEW 1: LIVE SCANNER WITH BUILT-IN AI SPOOF DETECTION & AUTO PHOTO CAPTURE
    ============================================================================ */
    function LiveScannerView({
      repository,
      aiSettings,
      onUpdateSettings,
      geoAccess,
      geofence,
      activePeriod,
      periods,
      checkPeriodEligibility,
      onNotice,
      attendanceLogs,
      isAdmin,
      onVerifiedAttendance,
      onSpoofDetected,
      onOpenCaptureDb
    }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const rafRef = useRef(null);

      const [cameraOn, setCameraOn] = useState(false);
      const [camError, setCamError] = useState(null);
      const [brightnessBoost, setBrightnessBoost] = useState(125);
      const [faceDetected, setFaceDetected] = useState(false);
      const [multiFaceInfo, setMultiFaceInfo] = useState({ total: 0, ignoredCount: 0 });
      const [matchState, setMatchState] = useState(null);
      const [spoofWarningBanner, setSpoofWarningBanner] = useState(null);
      const [livenessState, setLivenessState] = useState({
        suspiciousScore: 0,
        authenticityScore: 100,
        isSuspicious: false,
        verdict: 'Awaiting Camera',
        flags: [],
        agentDecision: 'IDLE',
        agentReason: 'Active AI Agent ready to verify live human presence.',
        challengePrompt: null,
        challengePassed: false,
        metrics: { moire: 0, glare: 0, motion: 85, depth: 85, skinTone: 90 }
      });
      const [lastVerifiedCard, setLastVerifiedCard] = useState(null);

      const streakRef = useRef({ personId: null, count: 0 });
      const cooldownRef = useRef({});
      const periodNoticeRef = useRef(0);
      const lastSpoofRecordRef = useRef(0);

      // Sync target selection mode (Nearest student vs Center) with engine
      useEffect(() => {
        if (window.FG && window.FG.setTargetSelectionMode) {
          window.FG.setTargetSelectionMode(aiSettings.nearestOnlyMode !== false ? 'nearest' : 'center');
        }
      }, [aiSettings.nearestOnlyMode]);

      const stopCamera = useCallback(() => {
        if (rafRef.current) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = null;
        }
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach((t) => t.stop());
          videoRef.current.srcObject = null;
        }
        window.FG.resetSpoofHistory();
        setCameraOn(false);
        setFaceDetected(false);
        setMultiFaceInfo({ total: 0, ignoredCount: 0 });
        setMatchState(null);
        streakRef.current = { personId: null, count: 0 };
      }, []);

      const startCamera = async () => {
        if (!geoAccess.allowed) {
          setCamError(geoAccess.reason || 'Scanning is blocked by geofence/schedule rules.');
          return;
        }
        setCamError(null);
        setSpoofWarningBanner(null);
        window.FG.resetSpoofHistory();
        try {
          const stream = await window.FG.openCamera(640, 480);
          if (videoRef.current) {
            window.FG.attachStream(videoRef.current, stream);
            setCameraOn(true);
          }
        } catch (err) {
          setCamError(err.message || 'Unable to start camera');
          setCameraOn(false);
        }
      };

      useEffect(() => {
        if (!geoAccess.allowed && cameraOn) {
          stopCamera();
        }
      }, [geoAccess.allowed, cameraOn, stopCamera]);

      const matchDescriptor = useCallback(
        (desc) => {
          if (!desc || repository.length === 0) return { person: null, confidence: 0, isMatch: false };
          const scored = repository
            .filter((p) => p.embedding && p.embedding.length === 128)
            .map((p) => ({
              person: p,
              confidence: window.FG.similarity(desc, p.embedding)
            }))
            .sort((a, b) => b.confidence - a.confidence);

          if (!scored.length) return { person: null, confidence: 0, isMatch: false };
          const top1 = scored[0];
          const top2Score = scored.length > 1 ? scored[1].confidence : 0;
          const margin = top1.confidence - top2Score;
          const isMatch = top1.confidence >= 76 && (scored.length === 1 || margin >= 7);
          return {
            person: isMatch ? top1.person : null,
            candidate: top1.person,
            confidence: top1.confidence,
            margin: Math.round(margin * 10) / 10,
            isMatch
          };
        },
        [repository]
      );

      // Draw real-time bounding boxes showing Nearest Target Student vs Ignored Background Faces
      const drawFaceBoxes = useCallback((allFaces, cw, ch, isSpoof, isChallenge) => {
        const ov = overlayCanvasRef.current;
        if (!ov) return;
        if (ov.width !== cw || ov.height !== ch) {
          ov.width = cw;
          ov.height = ch;
        }
        const octx = ov.getContext('2d');
        octx.clearRect(0, 0, cw, ch);
        if (!allFaces || !allFaces.length) return;

        allFaces.forEach((face) => {
          // Video is mirrored via scale-x-[-1], so mirror box X coordinate for visual alignment
          const mx = cw - (face.x + face.w);
          const my = face.y;
          const mw = face.w;
          const mh = face.h;

          if (face.primary) {
            const color = isSpoof ? '#f43f5e' : isChallenge ? '#f59e0b' : '#10b981';
            octx.strokeStyle = color;
            octx.lineWidth = 3;
            octx.strokeRect(mx, my, mw, mh);

            // Corner brackets
            const cl = Math.min(18, mw * 0.22);
            octx.lineWidth = 4.5;
            octx.beginPath();
