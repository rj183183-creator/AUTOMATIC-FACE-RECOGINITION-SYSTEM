                <div>
                  <div className="font-bold text-slate-900 dark:text-white">Strict Anti-Spoof Sensitivity</div>
                  <div className="text-slate-500 mt-0.5">Tighter threshold (54% vs 68%) for high-security exams</div>
                </div>
                <input
                  type="checkbox"
                  checked={aiSettings.strictMode}
                  onChange={(e) => onUpdateSettings({ ...aiSettings, strictMode: e.target.checked })}
                  className="w-5 h-5 accent-cyan-500"
                />
              </label>
            </div>
          </div>

          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <IconAlert className="w-5 h-5 text-rose-500" />
                <span>Blocked Mobile Photo / Video Spoof Attempts ({spoofAlerts.length})</span>
              </h3>
              {spoofAlerts.length > 0 && (
                <button
                  onClick={onClearSpoofAlerts}
                  className="text-xs font-semibold text-rose-500 hover:underline cursor-pointer"
                >
                  Clear Alerts
                </button>
              )}
            </div>

            {spoofAlerts.length === 0 ? (
              <p className="text-xs text-slate-500 py-8 text-center">
                No suspicious photo/video spoofing attempts recorded.
              </p>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {spoofAlerts.map((al) => (
                  <div key={al.id} className="rounded-xl border border-rose-500/40 bg-rose-950/10 overflow-hidden text-xs">
                    {al.snapshotUrl && (
                      <img src={al.snapshotUrl} alt="Spoof attempt" className="w-full h-40 object-cover" />
                    )}
                    <div className="p-3.5 space-y-1">
                      <div className="flex justify-between font-bold text-rose-500">
                        <span>Suspicion: {al.suspiciousScore}%</span>
                        <span className="font-mono">{new Date(al.timestamp).toLocaleTimeString()}</span>
                      </div>
                      <div className="font-semibold text-slate-800 dark:text-white">Student: {al.suspectedTarget}</div>
                      {al.sourceType && (
                        <div className="text-[11px] font-mono text-amber-600 dark:text-amber-300">Source: {al.sourceType}</div>
                      )}
                      <div className="text-[11px] text-slate-500">{al.flags.join(' • ') || 'Screen replay detected'}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ============================================================================
       VIEW 5: ADMIN GEOFENCE & ATTENDANCE PERIODS CONFIGURATION
    ============================================================================ */
    function AdminGeofencePeriodsView({
      geofence,
      onUpdateGeofence,
      geoAccess,
      periods,
      onUpdatePeriods,
      onResetPeriodMarks
    }) {
      const [locBusy, setLocBusy] = useState(false);
      const [locMsg, setLocMsg] = useState(null);

      const updateField = (patch) => onUpdateGeofence({ ...geofence, ...patch });

      const captureCurrentLocation = () => {
        if (!('geolocation' in navigator)) {
          setLocMsg('Geolocation is not supported in this browser.');
          return;
        }
        setLocBusy(true);
        setLocMsg(null);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            updateField({
              lat: Number(pos.coords.latitude.toFixed(6)),
              lng: Number(pos.coords.longitude.toFixed(6))
            });
            setLocMsg(`Coordinates locked (±${Math.round(pos.coords.accuracy)} m accuracy).`);
            setLocBusy(false);
          },
          (err) => {
            setLocMsg(err.code === 1 ? 'Location permission denied.' : 'Unable to read GPS location.');
            setLocBusy(false);
          },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      };

      const toggleDay = (dayIdx) => {
        const nextDays = geofence.days.includes(dayIdx)
          ? geofence.days.filter((d) => d !== dayIdx)
          : [...geofence.days, dayIdx].sort();
        updateField({ days: nextDays });
      };

      const updateWindow = (idx, key, val) => {
        updateField({
          windows: geofence.windows.map((w, i) => (i === idx ? { ...w, [key]: val } : w))
        });
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-5">
            <div className="flex items-start justify-between gap-4">
              <div>
                <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <IconPin className="w-5 h-5 text-cyan-500" />
                  <span>Geofence & Allowed Scan Hours</span>
                </h2>
                <p className="text-xs text-slate-500 dark:text-sky-300/70 mt-1">
                  Restrict face scanning and attendance recording to a physical campus radius and approved time windows.
                </p>
              </div>
              <label className="flex items-center gap-2 text-sm font-bold text-slate-800 dark:text-sky-200 cursor-pointer">
                <input
                  type="checkbox"
                  checked={geofence.enabled}
                  onChange={(e) => updateField({ enabled: e.target.checked })}
                  className="w-5 h-5 accent-cyan-500"
                />
                <span>Enable Geofence</span>
              </label>
            </div>

            <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1A284C] text-xs space-y-1">
              <div
                className={`font-bold ${
                  !geofence.enabled
                    ? 'text-slate-500 dark:text-sky-300/70'
                    : geoAccess.allowed
                    ? 'text-emerald-600 dark:text-emerald-400'
                    : 'text-rose-500'
                }`}
              >
                {!geofence.enabled
                  ? 'Geofence is currently OFF. Scanning is allowed from any location and time.'
                  : geoAccess.allowed
                  ? 'Geofence Active: Device is inside the allowed area and schedule.'
                  : geoAccess.reason}
              </div>
              {geofence.enabled && geoAccess.distance !== null && (
                <div className="font-mono text-slate-500 dark:text-sky-300/60">
                  Distance from center: {Math.round(geoAccess.distance)} m · GPS accuracy ±{Math.round(geoAccess.accuracy || 0)} m
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
              <label className="space-y-1">
                <span className="font-semibold text-slate-700 dark:text-sky-200 block">Center Latitude</span>
                <input
                  type="number"
                  step="0.000001"
                  value={geofence.lat ?? ''}
                  onChange={(e) => updateField({ lat: e.target.value === '' ? null : Number(e.target.value) })}
                  placeholder="e.g. 26.2313"
                  className="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                />
              </label>
              <label className="space-y-1">
                <span className="font-semibold text-slate-700 dark:text-sky-200 block">Center Longitude</span>
                <input
                  type="number"
                  step="0.000001"
                  value={geofence.lng ?? ''}
                  onChange={(e) => updateField({ lng: e.target.value === '' ? null : Number(e.target.value) })}
                  placeholder="e.g. 78.2053"
                  className="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                />
              </label>
              <label className="space-y-1">
                <span className="font-semibold text-slate-700 dark:text-sky-200 block">Allowed Radius (meters)</span>
                <input
                  type="number"
                  min="20"
                  max="5000"
                  value={geofence.radius}
                  onChange={(e) => updateField({ radius: Math.max(20, Math.min(5000, Number(e.target.value) || 100)) })}
                  className="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                />
              </label>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <button
                type="button"
                onClick={captureCurrentLocation}
                disabled={locBusy}
                className="brand-gradient text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow hover:opacity-95 disabled:opacity-50 flex items-center gap-2 cursor-pointer"
              >
                <IconPin className="w-4 h-4" />
                <span>{locBusy ? 'Reading GPS...' : 'Use My Current Location'}</span>
              </button>
              {locMsg && <span className="text-xs text-cyan-600 dark:text-cyan-400 font-medium">{locMsg}</span>}
            </div>

            <div className="space-y-3 pt-2 border-t border-slate-200 dark:border-[#1A284C]">
              <div className="text-xs font-bold text-slate-700 dark:text-sky-200">Allowed Days & Time Windows</div>
              <div className="flex flex-wrap gap-2">
                {DAYS_OF_WEEK.map((dayName, idx) => {
                  const active = geofence.days.includes(idx);
                  return (
                    <button
                      key={dayName}
                      type="button"
                      onClick={() => toggleDay(idx)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer ${
                        active
                          ? 'brand-gradient text-white border-transparent'
                          : 'bg-slate-50 dark:bg-[#0B1530] text-slate-600 dark:text-sky-300/70 border-slate-200 dark:border-[#1E3A8A]'
                      }`}
                    >
                      {dayName}
                    </button>
                  );
                })}
              </div>

              <div className="space-y-2">
                {geofence.windows.map((w, idx) => (
                  <div key={idx} className="flex items-center gap-2 text-xs">
                    <input
                      type="time"
                      value={w.start}
                      onChange={(e) => updateWindow(idx, 'start', e.target.value)}
                      className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                    />
                    <span className="text-slate-400">to</span>
                    <input
                      type="time"
                      value={w.end}
                      onChange={(e) => updateWindow(idx, 'end', e.target.value)}
                      className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                    />
                    <button
                      type="button"
                      onClick={() => updateField({ windows: geofence.windows.filter((_, i) => i !== idx) })}
                      className="p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg cursor-pointer"
                      title="Remove Window"
                    >
                      <IconTrash className="w-4 h-4" />
                    </button>
                  </div>
                ))}
                <button
                  type="button"
                  onClick={() => updateField({ windows: [...geofence.windows, { start: '09:00', end: '17:00' }] })}
                  className="text-xs font-semibold text-cyan-600 dark:text-cyan-400 hover:underline cursor-pointer"
                >
                  + Add Time Window
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-[#091226] p-6 rounded-2xl border border-slate-200 dark:border-[#1A284C] space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <IconClock className="w-5 h-5 text-cyan-500" />
                  <span>Real-Time Attendance Periods (1 Check-in per Student)</span>
                </h3>
                <p className="text-xs text-slate-500 dark:text-sky-300/70 mt-1">
                  Define lecture or shift periods. Inside an active period, each student can be marked present only once. Outside all periods, attendance is paused. Leave empty to allow continuous check-ins.
                </p>
              </div>
              {periods.length > 0 && (
                <button
                  type="button"
                  onClick={onResetPeriodMarks}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/15 text-amber-600 dark:text-amber-300 border border-amber-500/40 shrink-0 cursor-pointer"
                >
                  Reset Today's Period Locks
                </button>
              )}
            </div>

            <div className="space-y-2.5">
              {periods.map((p) => (
                <div key={p.id} className="flex flex-wrap items-center gap-2.5 text-xs">
                  <input
                    type="text"
                    value={p.name}
                    placeholder="Period Name (e.g. Lecture 1 - AI)"
                    onChange={(e) =>
                      onUpdatePeriods(periods.map((item) => (item.id === p.id ? { ...item, name: e.target.value } : item)))
                    }
                    className="flex-1 min-w-[160px] px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A]"
                  />
                  <input
                    type="time"
                    value={p.start}
                    onChange={(e) =>
                      onUpdatePeriods(periods.map((item) => (item.id === p.id ? { ...item, start: e.target.value } : item)))
                    }
                    className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                  />
                  <span className="text-slate-400">to</span>
                  <input
                    type="time"
                    value={p.end}
                    onChange={(e) =>
                      onUpdatePeriods(periods.map((item) => (item.id === p.id ? { ...item, end: e.target.value } : item)))
                    }
                    className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0B1530] border border-slate-200 dark:border-[#1E3A8A] font-mono"
                  />
                  <button
                    type="button"
                    onClick={() => onUpdatePeriods(periods.filter((item) => item.id !== p.id))}
                    className="p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg cursor-pointer"
                    title="Delete Period"
                  >
                    <IconTrash className="w-4 h-4" />
                  </button>
                </div>
              ))}

              <button
                type="button"
                onClick={() =>
                  onUpdatePeriods([
                    ...periods,
                    { id: 'PER-' + Date.now(), name: `Period ${periods.length + 1}`, start: '09:00', end: '10:00' }
                  ])
                }
                className="text-xs font-semibold text-cyan-600 dark:text-cyan-400 hover:underline cursor-pointer"
              >
                + Add Attendance Period
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================================
       VIEW 6: ADMIN LOGIN GATE
    ============================================================================ */
    function AdminLoginView({ title, subtitle, onSuccess }) {
      const [passcode, setPasscode] = useState('');
      const [error, setError] = useState(null);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passcode === ADMIN_PASSCODE) {
          setError(null);
          onSuccess();
        } else {
          setError('Incorrect admin passcode.');
        }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16">
          <form
            onSubmit={handleLogin}
            className="bg-white dark:bg-[#091226] border border-slate-200 dark:border-[#1A284C] rounded-2xl p-7 shadow-2xl space-y-5"
          >
            <div className="text-center space-y-2">
              <div className="w-12 h-12 mx-auto rounded-xl brand-gradient text-white flex items-center justify-center shadow">
                <IconLock className="w-6 h-6" />
              </div>
              <h2 className="text-lg font-bold text-slate-900 dark:text-white">{title}</h2>
              <p className="text-xs text-slate-500 dark:text-sky-300/70">{subtitle}</p>
            </div>

            <div className="space-y-2">
              <input
                type="password"
                value={passcode}
                onChange={(e) => setPasscode(e.target.value)}
                placeholder="Enter Admin Passcode"
                autoFocus
                className="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0B1530] border border-slate-300 dark:border-[#1E3A8A] text-slate-900 dark:text-white focus:outline-none focus:border-cyan-500"
              />
              {error && <p className="text-xs text-rose-500 font-semibold">{error}</p>}
            </div>

            <button
              type="submit"
              className="w-full brand-gradient text-white text-sm font-semibold py-2.5 rounded-xl shadow hover:opacity-95 cursor-pointer"
            >
              Unlock Admin Dashboard
            </button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
